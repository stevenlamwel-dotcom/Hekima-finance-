<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hekima Finance — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0b0f16; --panel:#121a26; --panel2:#0f1622; --border:#1e2836;
    --cyan:#22d3ee; --cyan-dim:rgba(34,211,238,0.15);
    --green:#34d399; --red:#f87171; --text:#e6edf5; --sub:#7c8aa0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:60px;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .topbar h1{font-size:17px;margin:0;font-weight:600;}
  .refresh-btn{background:var(--panel);border:1px solid var(--border);color:var(--cyan);padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;}

  .auth-gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .login-box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 22px;}
  .login-box h2{margin:0 0 4px;font-size:18px;}
  .login-box p{margin:0 0 18px;font-size:12px;color:var(--sub);}
  .login-input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;font-size:14px;margin-bottom:10px;}
  .login-btn{width:100%;background:var(--cyan);color:#00202a;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}
  .login-err{color:var(--red);font-size:12px;margin-top:10px;min-height:14px;}
  .logout-link{font-size:11px;color:var(--sub);cursor:pointer;text-decoration:underline;margin-left:10px;}

  .mtaji-card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:20px;padding:20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .mtaji-left{display:flex;align-items:center;gap:14px;}
  .mtaji-icon{width:44px;height:44px;border-radius:12px;background:var(--cyan-dim);display:flex;align-items:center;justify-content:center;color:var(--cyan);flex-shrink:0;}
  .mtaji-title{font-weight:600;font-size:15px;}
  .mtaji-sub{font-size:12px;color:var(--sub);margin-top:2px;}
  .mtaji-value{font-size:24px;font-weight:700;letter-spacing:-0.5px;text-align:right;}

  .kpi-row{display:flex;gap:10px;margin-bottom:20px;}
  .kpi{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;}
  .kpi .n{font-size:19px;font-weight:700;}
  .kpi .l{font-size:10.5px;color:var(--sub);margin-top:3px;}
  .kpi .n.green{color:var(--green);} .kpi .n.red{color:var(--red);}

  .section-label{text-transform:uppercase;font-size:12px;letter-spacing:1.5px;color:var(--sub);font-weight:700;margin:0 0 12px 4px;}
  .analysis-panel{position:relative;border:1px solid var(--border);border-radius:16px;padding:14px;background:rgba(255,255,255,0.01);}
  .analysis-panel::before, .analysis-panel::after{content:"";position:absolute;top:-1px;width:22px;height:22px;border-top:2px solid var(--cyan);}
  .analysis-panel::before{left:-1px;border-left:2px solid var(--cyan);border-top-left-radius:10px;}
  .analysis-panel::after{right:-1px;border-right:2px solid var(--cyan);border-top-right-radius:10px;}

  .agent-card{background:var(--panel);border-radius:14px;overflow:hidden;margin-bottom:14px;}
  .agent-card:last-child{margin-bottom:0;}
  .agent-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;}
  .agent-badge{background:var(--cyan-dim);color:var(--cyan);font-weight:700;font-size:12px;padding:5px 10px;border-radius:8px;letter-spacing:0.5px;}
  .agent-name{font-size:15px;font-weight:600;}
  .agent-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--border);font-size:14px;}
  .agent-row .lbl{color:var(--sub);font-size:13px;}
  .val-count{font-weight:600;}
  .val-green{color:var(--green);font-weight:700;font-variant-numeric:tabular-nums;}
  .val-red{color:var(--red);font-weight:700;font-variant-numeric:tabular-nums;}
  .val-total{font-weight:700;font-variant-numeric:tabular-nums;}
  .chapa-row{padding:12px 16px 14px;border-top:1px solid var(--border);}
  .chapa-btn{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--cyan);color:var(--cyan);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;}

  .state-msg{text-align:center;color:var(--sub);font-size:13px;padding:30px 0;}
  .footnote{font-size:11px;color:var(--sub);text-align:center;margin-top:24px;line-height:1.6;}
  @media print{ body{background:#fff;color:#000;} .refresh-btn,.chapa-btn{display:none;} }
</style>
</head>
<body>

<div class="auth-gate" id="authGate">
  <div class="login-box">
    <h2>Ingia — Hekima Finance</h2>
    <p>Tumia akaunti yako kuingia.</p>
    <input class="login-input" id="loginEmail" type="email" placeholder="Email">
    <input class="login-input" id="loginPass" type="password" placeholder="Password">
    <button class="login-btn" onclick="doLogin()">Ingia</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="appContent" style="display:none">
<div class="wrap">
  <div class="topbar">
    <h1>Hekima Finance</h1>
    <div><button class="refresh-btn" onclick="loadDashboard()">↻ Onyesha upya</button><span class="logout-link" onclick="doLogout()">Toka</span></div>
  </div>

  <div class="mtaji-card">
    <div class="mtaji-left">
      <div class="mtaji-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 3 7l9 5 9-5-9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg></div>
      <div><div class="mtaji-title">Jumla ya Mtaji</div><div class="mtaji-sub">Fedha zote zinazozunguka</div></div>
    </div>
    <div class="mtaji-value" id="jumlaMtaji">…</div>
  </div>

  <div class="kpi-row">
    <div class="kpi"><div class="n" id="kpiWateja">…</div><div class="l">Jumla Wateja</div></div>
    <div class="kpi"><div class="n green" id="kpiSafi">…</div><div class="l">Mtaji Safi</div></div>
    <div class="kpi"><div class="n red" id="kpiChafu">…</div><div class="l">Mtaji Mchafu</div></div>
  </div>

  <div class="section-label">Uchambuzi kwa Wakala</div>
  <div class="analysis-panel"><div id="agentList"><div class="state-msg">Inapakia data...</div></div></div>

  <div class="footnote" id="footnote"></div>
</div>
</div>

<script>
const SUPABASE_URL = "https://euhteovuhdvefzaavlqx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1aHRlb3Z1aGR2ZWZ6YWF2bHF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjQwNjEsImV4cCI6MjA5NzE0MDA2MX0.gaV1mShFhVHVpxAqCptJsiSr4r-d3_OYvdtH0bpR58Q";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const DAY = 86400000;

function tzs(n){ return Math.round(n).toLocaleString('en-US') + " TZS"; }
function statusOf(c){ return (Date.now() > Date.parse(c.d_kamilisha) + DAY) ? 'chafu' : 'safi'; }
function deniBaki(c){ return Math.max(0, Number(c.jumla) - (c.mikopo_payments||[]).reduce((s,p)=>s+Number(p.kiasi),0)); }

async function loadDashboard(){
  document.getElementById('jumlaMtaji').textContent = "…";
  document.getElementById('agentList').innerHTML = '<div class="state-msg">Inapakia data...</div>';
  try{
    const [{data: agents, error:e1}, {data: clients, error:e2}] = await Promise.all([
      sb.from('mikopo_agents').select('*').order('code'),
      sb.from('mikopo_clients').select('*, mikopo_payments(*)'),
    ]);
    if(e1) throw e1; if(e2) throw e2;

    const agentName = {}; (agents||[]).forEach(a=> agentName[a.code]=a.name);
    const buckets = {}; (agents||[]).forEach(a=> buckets[a.code] = {name:a.name, count:0, safi:0, chafu:0});

    let totalSafi=0, totalChafu=0;
    (clients||[]).forEach(c=>{
      const bal = deniBaki(c);
      const st = statusOf(c);
      if(st==='safi') totalSafi += bal; else totalChafu += bal;
      if(c.agent_code && buckets[c.agent_code]){
        buckets[c.agent_code].count += 1;
        if(st==='safi') buckets[c.agent_code].safi += bal; else buckets[c.agent_code].chafu += bal;
      }
    });

    document.getElementById('jumlaMtaji').textContent = tzs(totalSafi+totalChafu);
    document.getElementById('kpiWateja').textContent = (clients||[]).length;
    document.getElementById('kpiSafi').textContent = tzs(totalSafi);
    document.getElementById('kpiChafu').textContent = tzs(totalChafu);

    const codes = Object.keys(buckets).filter(c=>buckets[c].count>0);
    const listEl = document.getElementById('agentList');
    listEl.innerHTML = codes.length===0 ? '<div class="state-msg">Bado hakuna data.</div>' :
      codes.map(code=>{
        const b = buckets[code];
        return `
        <div class="agent-card">
          <div class="agent-head"><span class="agent-badge">${code}</span><span class="agent-name">${b.name}</span></div>
          <div class="agent-row"><span class="lbl">Wateja</span><span class="val-count">${b.count}</span></div>
          <div class="agent-row"><span class="lbl">Mtaji Safi</span><span class="val-green">${tzs(b.safi)}</span></div>
          <div class="agent-row"><span class="lbl">Mtaji Mchafu</span><span class="val-red">${tzs(b.chafu)}</span></div>
          <div class="agent-row"><span class="lbl">Jumla</span><span class="val-total">${tzs(b.safi+b.chafu)}</span></div>
          <div class="chapa-row"><button class="chapa-btn" onclick="window.print()">🖨️ Chapa</button></div>
        </div>`;
      }).join('');

    document.getElementById('footnote').textContent = "Data live — " + new Date().toLocaleString('sw-TZ');
  } catch(err){
    document.getElementById('jumlaMtaji').textContent = "Hitilafu";
    document.getElementById('agentList').innerHTML = '<div class="state-msg">Imeshindikana kupakia: '+(err.message||err)+'</div>';
  }
}

async function checkAuth(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){ enterApp(); } else {
    document.getElementById('authGate').style.display='flex';
    document.getElementById('appContent').style.display='none';
  }
}
function enterApp(){
  document.getElementById('authGate').style.display='none';
  document.getElementById('appContent').style.display='block';
  loadDashboard();
}
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent='';
  const {error} = await sb.auth.signInWithPassword({email,password:pass});
  if(error){ document.getElementById('loginErr').textContent = error.message; return; }
  enterApp();
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }
checkAuth();
</script>
</body>
</html>
