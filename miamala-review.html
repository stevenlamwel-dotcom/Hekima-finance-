<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hekima Finance — Maombi ya Miamala</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#00183c; --panel:#0b2a5b; --panel2:#082150; --border:#1d3f74;
    --gold:#cc9c24; --gold-dim:rgba(204,156,36,0.16); --green:#008454; --red:#e2645a;
    --text:#eef2f6; --sub:#93a7ba;
  }
  html[data-theme="light"]{ --bg:#f4f6f8; --panel:#ffffff; --panel2:#e9edf3; --border:#dfe4ec; --text:#001848; --sub:#51606c; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:30px;}
  .wrap{max-width:640px;margin:0 auto;padding:14px 12px 30px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .topbar h1{font-size:16px;margin:0;font-weight:800;}
  .back-link{color:var(--gold);text-decoration:none;font-size:13px;font-weight:600;}

  .auth-gate{position:fixed;inset:0;background:linear-gradient(160deg,#00183c 0%,#0b2a5b 60%,#00183c 100%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .auth-loading{color:#dbe3ea;font-size:13px;text-align:center;max-width:320px;line-height:1.5;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
  .empty{font-size:13px;color:var(--sub);text-align:center;padding:30px 10px;}
  .req{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--panel2);}
  .req .rh{display:flex;justify-content:space-between;font-weight:800;font-size:14px;}
  .req .rm{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5;}
  .req a.pdf{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--gold);text-decoration:none;font-weight:700;}
  input.dnote{width:100%;margin-top:9px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 9px;border-radius:7px;font-size:13px;}
  .rbtns{display:flex;gap:8px;margin-top:9px;}
  .rbtns button{flex:1;border:none;border-radius:8px;padding:10px;font-size:12.5px;font-weight:800;cursor:pointer;}
  .rbtns .ok{background:var(--green);color:#052015;}
  .rbtns .no{background:var(--red);color:#2a0805;}
  .msg{font-size:12px;margin-top:6px;min-height:14px;}
  .msg.ok{color:var(--green);} .msg.err{color:var(--red);}
  .tabs{display:flex;gap:6px;margin-bottom:10px;}
  .tabs button{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--sub);padding:9px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .tabs button.active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold);}
  .statusPill{display:inline-block;font-size:9.5px;font-weight:800;border-radius:20px;padding:1px 7px;}
  .statusPill.inasubiri{background:var(--gold-dim);color:var(--gold);}
  .statusPill.imekubaliwa{background:rgba(31,157,116,0.16);color:var(--green);}
  .statusPill.imekataliwa{background:rgba(226,100,90,0.16);color:var(--red);}
  /* XL-FIT */
  input,select,textarea{max-width:100%;box-sizing:border-box;}
  table{max-width:100%;}
  .xl-scroll{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;}
  /* HEKIMA: watermark ya chapa (uwazi 5%), haizuii kubofya */
  .hk-wm{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;background:url(assets/hekima-watermark.png) center center/min(72vw,520px) no-repeat;}

  /* ===== HEKIMA FINANCE — Maombi ya Miamala (CSS pekee; logic haijaguswa) ===== */
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.005em;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{letter-spacing:-.01em;color:var(--hk-navy,#001848);}
  .req{border-radius:14px;box-shadow:0 2px 10px rgba(0,24,72,.06);border:1px solid var(--line,#dfe4ec);padding:14px;margin-bottom:12px;}
  .rh{font-weight:800;color:var(--hk-navy,#001848);}
  .rm{font-size:12.5px;color:var(--sub,#51606c);}
  .rbtns{gap:8px;flex-wrap:wrap;}
  .rbtns button{border-radius:10px;font-weight:700;}
  .tabs{gap:6px;flex-wrap:wrap;}
  .statusPill{border-radius:12px;font-size:11.5px;font-weight:700;padding:3px 9px;display:inline-block;}
  .statusPill.inasubiri{background:#eef2fb;color:#1f3f74;}
  .statusPill.imekubaliwa{background:#e7f5ee;color:#0b6b48;}
  .statusPill.imekataliwa{background:#fbeaea;color:#8a2a22;}
  .empty{border:1px dashed #c9d2df;border-radius:12px;padding:18px;text-align:center;color:var(--sub,#51606c);background:#fbfcfe;}
  .topbar{margin-bottom:10px;}
  .pdf{border-radius:10px;}
  @media (max-width:640px){ .req{padding:12px;} .rbtns button{padding:10px 12px;flex:1 1 auto;} }
</style>
<link rel="stylesheet" href="assets/hekima-brand.css">
<link rel="stylesheet" href="assets/hekima-topbar.css">
<link rel="stylesheet" href="assets/hekima-shell.css"><script defer src="assets/hekima-shell.js"></script></head>
<body>
<div class="hk-wm" aria-hidden="true"></div>

<div class="auth-gate" id="authGate"><div class="auth-loading" id="authLoading">Inapakia...</div></div>

<div id="appContent" style="display:none">
  <div class="wrap">
    <div class="topbar">
      <h1>Maombi ya Miamala</h1>
      <a href="portal.html" class="back-link">‹ Menu</a>
    </div>
    <div class="tabs">
      <button class="active" id="tabPending" onclick="switchTab('pending')">Yanayosubiri</button>
      <button id="tabDecided" onclick="switchTab('decided')">Yaliyoamuliwa</button>
    </div>
    <div id="list"><div class="empty">Inapakia...</div></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://euhteovuhdvefzaavlqx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1aHRlb3Z1aGR2ZWZ6YWF2bHF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjQwNjEsImV4cCI6MjA5NzE0MDA2MX0.gaV1mShFhVHVpxAqCptJsiSr4r-d3_OYvdtH0bpR58Q";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let TAB = 'pending';
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return (Number(n)||0).toLocaleString('en-US'); }

function switchTab(t){
  TAB=t;
  document.getElementById('tabPending').className = t==='pending' ? 'active' : '';
  document.getElementById('tabDecided').className = t==='decided' ? 'active' : '';
  loadList();
}

async function loadList(){
  const box = document.getElementById('list');
  box.innerHTML = '<div class="empty">Inapakia...</div>';
  const q = sb.from('miamala_requests').select('*').order('work_date', {ascending:false}).order('created_at', {ascending:false});
  const { data, error } = TAB==='pending' ? await q.eq('status','inasubiri') : await q.neq('status','inasubiri');
  if(error){ box.innerHTML = '<div class="empty">Imeshindwa kupakia: '+esc(error.message)+'</div>'; return; }
  const rows = data||[];
  if(!rows.length){ box.innerHTML = '<div class="empty">'+(TAB==='pending' ? 'Hakuna ombi linalosubiri.' : 'Hakuna ombi lililoamuliwa bado.')+'</div>'; return; }
  const codes = [...new Set(rows.map(r => r.agent_code))];
  const zoneOk = {}, supOk = {};
  await Promise.all(codes.map(async c => {
    const [z, s2] = await Promise.all([
      sb.rpc('is_zone_manager_of_agent', { p_agent_code: c }),
      sb.rpc('is_approver_for_agent', { p_agent_code: c })
    ]);
    supOk[c] = !!(s2 && s2.data);
    zoneOk[c] = !!((z && z.data) || supOk[c]);
  }));
  const clientsByReq = {};
  await Promise.all(rows.map(async r => {
    const { data } = await sb.rpc('list_request_clients', { p_request_id: r.id });
    clientsByReq[r.id] = data || [];
  }));
  const kindLbl = k => k==='zamani' ? '<span style="color:var(--gold)">(Zamani)</span>' : '<span style="color:var(--sub)">(Mpya)</span>';
  const clientLineHtml = c => `
    <div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12.5px;">
      <span>${esc(c.client_name)}${c.nickname ? ' <span style="color:var(--sub)">· '+esc(c.nickname)+'</span>' : ''} ${kindLbl(c.client_kind)}${c.phone ? '<br><span style="color:var(--sub);font-size:11px">'+esc(c.phone)+'</span>' : ''}</span>
      <span style="text-align:right;flex:0 0 auto;">Tsh ${fmt(c.amount)}<br>${statusPill(c.status)}</span>
    </div>
    ${c.reject_reason ? `<div style="font-size:11px;color:var(--red);padding:2px 0 4px;">${esc(c.reject_reason)}</div>` : ''}
  `;
  const stageLbl = st => st==='supervisor' ? '<span style="color:var(--green)">✓ Imepitishwa na Zone</span> · Inasubiri Supervisor' : 'Inasubiri Zone';
  const btns = (id, stage) => `
        <input class="dnote" placeholder="Maelezo ya uamuzi (hiari)" id="dn-${id}">
        <div class="rbtns">
          <button class="ok" onclick="decide('${id}',true,'${stage}')">Kubali</button>
          <button class="no" onclick="decide('${id}',false,'${stage}')">Kataa</button>
        </div>
        <div class="msg" id="msg-${id}"></div>`;
  window.stageBlock = r => {
    const st = r.stage || 'zone';
    const head = `<div class="rm" style="margin-top:8px;">Hatua: ${stageLbl(st)}</div>`;
    if(st === 'zone') return head + (zoneOk[r.agent_code] ? btns(r.id,'zone') : '<div class="rm" style="color:var(--gold)">Linasubiri idhini ya Zone.</div>');
    return head + (supOk[r.agent_code] ? btns(r.id,'sup') : '<div class="rm" style="color:var(--gold)">Linasubiri idhini ya Supervisor.</div>');
  };
  box.innerHTML = rows.map(r => `
    <div class="req" id="req-${r.id}">
      <div class="rh"><span>${esc(r.agent_code)}</span><span>Tsh ${fmt(r.amount)}</span></div>
      <div class="rm">Tarehe ya muamala: ${esc(r.work_date)}${r.note ? ' · '+esc(r.note) : ''}${r.status!=='inasubiri' ? ' · Hali ya ombi: '+esc(r.status) : ''}</div>
      <a class="pdf" href="#" onclick="openPdf('${esc(r.pdf_path)}');return false;">📄 Fungua Fomu (PDF)</a>
      <div style="margin-top:8px;">${(clientsByReq[r.id]||[]).map(clientLineHtml).join('') || '<div class="empty" style="padding:8px 0;">Hakuna wateja waliorekodiwa.</div>'}</div>
      ${TAB==='pending' ? stageBlock(r) : ''}
    </div>
  `).join('');
}
function statusPill(s){
  if(s==='imekubaliwa') return '<span class="statusPill imekubaliwa">Imekubaliwa</span>';
  if(s==='imekataliwa') return '<span class="statusPill imekataliwa">Imekataliwa</span>';
  return '<span class="statusPill inasubiri">Inasubiri</span>';
}

async function openPdf(path){
  const { data, error } = await sb.storage.from('miamala-forms').createSignedUrl(path, 300);
  if(error){ alert('Imeshindwa kufungua fomu: '+error.message); return; }
  window.open(data.signedUrl, '_blank');
}

async function decide(id, approve, stage){
  const msg = document.getElementById('msg-'+id);
  const note = (document.getElementById('dn-'+id)||{}).value || null;
  msg.textContent = 'Inahifadhi...'; msg.className='msg';
  const fn = stage === 'zone' ? 'miamala_zone_decide' : 'decide_miamala_request';
  const { error } = await sb.rpc(fn, { p_id:id, p_approve:approve, p_note:note });
  if(error){ msg.textContent = 'Imeshindwa: '+error.message; msg.className='msg err'; return; }
  msg.textContent = approve ? (stage==='zone' ? 'Limepitishwa na Zone ✓ · sasa linaenda kwa Supervisor' : 'Limekubaliwa ✓') : 'Limekataliwa'; msg.className='msg ok';
  setTimeout(loadList, 700);
}

async function init(){
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(!session){ location.replace('portal.html'); return; }
    document.getElementById('authGate').style.display='none';
    document.getElementById('appContent').style.display='block';
    loadList();
  }catch(e){
    document.getElementById('authLoading').innerHTML = 'Hitilafu: '+esc(e.message||e);
  }
}
init();

/* XL-NAV: mishale kama Excel kwenye visanduku vya namba. Mshale hauongezi/kupunguza namba. */
(function(){
  if(window.__xlNav) return; window.__xlNav=true;
  function isNum(el){ return el && el.tagName==='INPUT' && el.type==='number' && !el.disabled && !el.readOnly && el.offsetParent!==null; }
  function scopeOf(el){ return el.closest('form, .grid8, .card, .bx-card, .box, .modal, .sheet, .panel') || document; }
  document.addEventListener('keydown', function(e){
    const t=e.target; if(!isNum(t)) return;
    const keys=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'];
    if(!keys.includes(e.key)) return;
    if(e.key!=='Enter') e.preventDefault();
    const cands=[...scopeOf(t).querySelectorAll('input[type="number"]')].filter(c=>c!==t && isNum(c));
    const r=t.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    let best=null, bestScore=Infinity;
    cands.forEach(c=>{
      const q=c.getBoundingClientRect(), x=q.left+q.width/2, y=q.top+q.height/2, dx=x-cx, dy=y-cy;
      let ok=false, score=0;
      if(e.key==='ArrowRight'){ ok=dx>5; score=dx+Math.abs(dy)*3; }
      else if(e.key==='ArrowLeft'){ ok=dx<-5; score=-dx+Math.abs(dy)*3; }
      else if(e.key==='ArrowDown'){ ok=dy>5; score=dy+Math.abs(dx)*3; }
      else if(e.key==='ArrowUp'){ ok=dy<-5; score=-dy+Math.abs(dx)*3; }
      else if(e.key==='Enter'){ ok=dy>5; score=dy+Math.abs(dx)*3; }
      if(ok && score<bestScore){ bestScore=score; best=c; }
    });
    if(best){ if(e.key==='Enter') e.preventDefault(); best.focus(); if(best.select) best.select(); }
  }, true);
})();
</script>
<script src="assets/hekima-topbar.js"></script>
</body>
</html>
