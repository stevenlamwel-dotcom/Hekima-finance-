      <button id="tabDecided" onclick="switchTab('decided')">Yaliyoamuliwa</button>
    </div>

  </div>
</div>

<script>
const SUPABASE_URL = "https://euhteovuhdvefzaavlqx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1aHRlb3Z1aGR2ZWZ6YWF2bHF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjQwNjEsImV4cCI6MjA5NzE0MDA2MX0.gaV1mShFhVHVpxAqCptJsiSr4r-d3_OYvdtH0bpR58Q";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let TAB = 'pending';
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return (Number(n)||0).toLocaleString('en-US'); }

function switchTab(t){
  TAB=t;
  document.getElementById('tabPending').className = t==='pending' ? 'active' : '';
  document.getElementById('tabDecided').className = t==='decided' ? 'active' : '';
  loadList();
}

async function loadList(){
  const box = document.getElementById('list');
  box.innerHTML = '<div class="empty">Inapakia...</div>';
  const q = sb.from('miamala_requests').select('*').order('work_date', {ascending:false}).order('created_at', {ascending:false});
  const { data, error } = TAB==='pending' ? await q.eq('status','inasubiri') : await q.neq('status','inasubiri');
  if(error){ box.innerHTML = '<div class="empty">Imeshindwa kupakia: '+esc(error.message)+'</div>'; return; }
  const rows = data||[];
  if(!rows.length){ box.innerHTML = '<div class="empty">'+(TAB==='pending' ? 'Hakuna ombi linalosubiri.' : 'Hakuna ombi lililoamuliwa bado.')+'</div>'; return; }
  const codes = [...new Set(rows.map(r => r.agent_code))];
  const zoneOk = {}, supOk = {};
  await Promise.all(codes.map(async c => {
    const [z, s2] = await Promise.all([
      sb.rpc('is_zone_manager_of_agent', { p_agent_code: c }),
      sb.rpc('is_approver_for_agent', { p_agent_code: c })
    ]);
    supOk[c] = !!(s2 && s2.data);
    zoneOk[c] = !!((z && z.data) || supOk[c]);
  }));
  const clientsByReq = {};
  await Promise.all(rows.map(async r => {
    const { data } = await sb.rpc('list_request_clients', { p_request_id: r.id });
    clientsByReq[r.id] = data || [];
  }));
  const kindLbl = k => k==='zamani' ? '<span style="color:var(--gold)">(Zamani)</span>' : '<span style="color:var(--sub)">(Mpya)</span>';
  const clientLineHtml = c => `
    <div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12.5px;">
      <span>${esc(c.client_name)}${c.nickname ? ' <span style="color:var(--sub)">· '+esc(c.nickname)+'</span>' : ''} ${kindLbl(c.client_kind)}${c.phone ? '<br><span style="color:var(--sub);font-size:11px">'+esc(c.phone)+'</span>' : ''}</span>
      <span style="text-align:right;flex:0 0 auto;">Tsh ${fmt(c.amount)}<br>${statusPill(c.status)}</span>
    </div>
    ${c.reject_reason ? `<div style="font-size:11px;color:var(--red);padding:2px 0 4px;">${esc(c.reject_reason)}</div>` : ''}
  `;
  const stageLbl = st => st==='supervisor' ? '<span style="color:var(--green)">✓ Imepitishwa na Zone</span> · Inasubiri Supervisor' : 'Inasubiri Zone';
  const btns = (id, stage) => `
        <input class="dnote" placeholder="Maelezo ya uamuzi (hiari)" id="dn-${id}">
        <div class="rbtns">
          <button class="ok" onclick="decide('${id}',true,'${stage}')">Kubali</button>
          <button class="no" onclick="decide('${id}',false,'${stage}')">Kataa</button>
        </div>
        <div class="msg" id="msg-${id}"></div>`;
  window.stageBlock = r => {
    const st = r.stage || 'zone';
    const head = `<div class="rm" style="margin-top:8px;">Hatua: ${stageLbl(st)}</div>`;
    if(st === 'zone') return head + (zoneOk[r.agent_code] ? btns(r.id,'zone') : '<div class="rm" style="color:var(--gold)">Linasubiri idhini ya Zone.</div>');
    return head + (supOk[r.agent_code] ? btns(r.id,'sup') : '<div class="rm" style="color:var(--gold)">Linasubiri idhini ya Supervisor.</div>');
  };
  box.innerHTML = rows.map(r => `
    <div class="req" id="req-${r.id}">
      <div class="rh"><span>${esc(r.agent_code)}</span><span>Tsh ${fmt(r.amount)}</span></div>
      <div class="rm">Tarehe ya muamala: ${esc(r.work_date)}${r.note ? ' · '+esc(r.note) : ''}${r.status!=='inasubiri' ? ' · Hali ya ombi: '+esc(r.status) : ''}</div>
      <a class="pdf" href="#" onclick="openPdf('${esc(r.pdf_path)}');return false;">📄 Fungua Fomu (PDF)</a>
      <div style="margin-top:8px;">${(clientsByReq[r.id]||[]).map(clientLineHtml).join('') || '<div class="empty" style="padding:8px 0;">Hakuna wateja waliorekodiwa.</div>'}</div>
      ${TAB==='pending' ? stageBlock(r) : ''}
    </div>
  `).join('');
}
function statusPill(s){
  if(s==='imekubaliwa') return '<span class="statusPill imekubaliwa">Imekubaliwa</span>';
  if(s==='imekataliwa') return '<span class="statusPill imekataliwa">Imekataliwa</span>';
  return '<span class="statusPill inasubiri">Inasubiri</span>';
}

async function openPdf(path){
  const { data, error } = await sb.storage.from('miamala-forms').createSignedUrl(path, 300);
  if(error){ alert('Imeshindwa kufungua fomu: '+error.message); return; }
  window.open(data.signedUrl, '_blank');
}

async function decide(id, approve, stage){
  const msg = document.getElementById('msg-'+id);
  const note = (document.getElementById('dn-'+id)||{}).value || null;
  msg.textContent = 'Inahifadhi...'; msg.className='msg';
  const fn = stage === 'zone' ? 'miamala_zone_decide' : 'decide_miamala_request';
  const { error } = await sb.rpc(fn, { p_id:id, p_approve:approve, p_note:note });
  if(error){ msg.textContent = 'Imeshindwa: '+error.message; msg.className='msg err'; return; }
  msg.textContent = approve ? (stage==='zone' ? 'Limepitishwa na Zone ✓ · sasa linaenda kwa Supervisor' : 'Limekubaliwa ✓') : 'Limekataliwa'; msg.className='msg ok';
  setTimeout(loadList, 700);
}

async function init(){
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(!session){ (window.HkNav?HkNav.home():location.replace('portal.html')); return; }
    document.getElementById('authGate').style.display='none';
    document.getElementById('appContent').style.display='block';
    loadList();
  }catch(e){
    document.getElementById('authLoading').innerHTML = 'Hitilafu: '+esc(e.message||e);
  }
}
init();

/* XL-NAV: mishale kama Excel kwenye visanduku vya namba. Mshale hauongezi/kupunguza namba. */
(function(){
  if(window.__xlNav) return; window.__xlNav=true;
  function isNum(el){ return el && el.tagName==='INPUT' && el.type==='number' && !el.disabled && !el.readOnly && el.offsetParent!==null; }
  function scopeOf(el){ return el.closest('form, .grid8, .card, .bx-card, .box, .modal, .sheet, .panel') || document; }
  document.addEventListener('keydown', function(e){
    const t=e.target; if(!isNum(t)) return;
    const keys=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'];
    if(!keys.includes(e.key)) return;
    if(e.key!=='Enter') e.preventDefault();
    const cands=[...scopeOf(t).querySelectorAll('input[type="number"]')].filter(c=>c!==t && isNum(c));
    const r=t.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    let best=null, bestScore=Infinity;
    cands.forEach(c=>{
      const q=c.getBoundingClientRect(), x=q.left+q.width/2, y=q.top+q.height/2, dx=x-cx, dy=y-cy;
      let ok=false, score=0;
      if(e.key==='ArrowRight'){ ok=dx>5; score=dx+Math.abs(dy)*3; }
      else if(e.key==='ArrowLeft'){ ok=dx<-5; score=-dx+Math.abs(dy)*3; }
      else if(e.key==='ArrowDown'){ ok=dy>5; score=dy+Math.abs(dx)*3; }
      else if(e.key==='ArrowUp'){ ok=dy<-5; score=-dy+Math.abs(dx)*3; }
      else if(e.key==='Enter'){ ok=dy>5; score=dy+Math.abs(dx)*3; }
      if(ok && score<bestScore){ bestScore=score; best=c; }
    });
    if(best){ if(e.key==='Enter') e.preventDefault(); best.focus(); if(best.select) best.select(); }
  }, true);
})();
</script>

.hk-dk svg{width:22px;height:22px;}
.hk-dk.on{color:var(--green);}
.hk-dot{position:absolute;top:0;right:24%;width:8px;height:8px;border-radius:50%;background:var(--gold);}
.hk-more{position:fixed;inset:0;z-index:28;background:rgba(0,10,25,.62);display:none;}
.hk-more.open{display:block;}
.hk-more-in{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 24px),520px);background:var(--bg);border:.5px solid var(--border);border-radius:20px;padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:calc(100vh - 140px);overflow:auto;}
.hk-z{background:var(--panel);border:.5px solid var(--border);border-radius:14px;padding:12px;text-align:left;color:var(--text);cursor:pointer;font-family:inherit;}
.hk-z svg{width:22px;height:22px;color:var(--green);display:block;margin-bottom:8px;}
.hk-z .n{font-size:14px;font-weight:600;}
.hk-z .s{font-size:12px;color:var(--sub);margin-top:2px;}
.hk-z.on{border-color:var(--green);}
.hk-z.warn svg{color:var(--red);}
}
@media print{#hkDock,#hkMore{display:none!important;}}

/* ===== MWANGA (white mode) — rangi za brand; Giza hapo juu halijaguswa ===== */
html[data-theme="light"]{
  --bg:#f4f6f8;--panel:#ffffff;--panel2:#e9edf3;--border:#dfe4ec;
  --text:#001848;--sub:#51606c;--cyan:#cc9c24;--cyan-dim:rgba(204,156,36,.16);--gold:#cc9c24;--gold-dim:rgba(204,156,36,.16);
  --green:#008454;--red:#c62828;
  --hk-navy:#001848;--line:#dfe4ec;--hk-green:#008454;--hk-gold:#cc9c24;
  color-scheme:light;
}
html[data-theme="light"] .tabs>.tab.active,html[data-theme="light"] .tabs>button.active{color:#fff!important;}
html[data-theme="light"] .btn:not(.secondary):not(.danger):not(.red):not(.gold){color:#fff;}
html[data-theme="light"] .msg.ok{background:rgba(0,132,84,.10);}
html[data-theme="light"] .msg.err{color:#b3261e;}
html[data-theme="light"] .badge.active,html[data-theme="light"] .badge.present{background:rgba(0,132,84,.12);color:#006b43;}
html[data-theme="light"] .badge.inactive,html[data-theme="light"] .badge.absent{background:rgba(198,40,40,.12);color:#b3261e;}
html[data-theme="light"] .badge.late{background:rgba(204,156,36,.20);color:#7a5a10;}
html[data-theme="light"] #hkDock{box-shadow:0 6px 24px rgba(0,24,72,.14);}
html[data-theme="light"] a[style*="color:var(--cyan)"],html[data-theme="light"] [style^="color:var(--gold)"],html[data-theme="light"] [style*=";color:var(--gold)"]{color:#7a5a10!important;}
html[data-theme="light"] .refresh-btn,html[data-theme="light"] .print-btn{color:#7a5a10;}
</style>

<script id="hkDockJS">
/* Menyu ya chini ya Updates: viungo vya kurasa. Haibadilishi logic ya ukurasa. */
(function(){
  var h=document.documentElement;
  /* Mandhari (Giza/Mwanga) inafuata chaguo la mtumiaji; hailazimishwi tena kuwa giza. */
  var ICON={dashboard:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
    users:'<circle cx="9" cy="8" r="3"/><path d="M3.5 20c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.5c2.5 0 4.5 2 4.5 4.5"/>',
    card:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h3"/>',
    bars:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    print:'<path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="8" rx="1.5"/><path d="M6 17h12v5H6z"/>',
    swap:'<path d="M7 8h13l-3.5-3.5M17 16H4l3.5 3.5"/>',
    dots:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'};
  function svg(k){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[k]+'</svg>'; }
  var PRIM=[['dashboard.html','Dashboard','dashboard'],['cust-list.html','Client List','users'],['refund.html','Refund','card'],['report.html','Report','bars']];
  var MORE=[['mkeka.html','Mkeka','print','Karatasi ya kuchapisha kwa mawakala',0],['miamala-review.html','Maombi ya Miamala','swap','Pitia na idhinisha miamala',1]];
  var file=(location.pathname.split('/').pop()||'index.html'), canMiamala=false, open=false;
  var dock=document.createElement('nav'); dock.id='hkDock'; dock.setAttribute('aria-label','Menyu');
  var sheet=document.createElement('div'); sheet.id='hkMore'; sheet.className='hk-more';
  document.body.appendChild(dock); document.body.appendChild(sheet);
  sheet.addEventListener('click',function(e){ if(e.target===sheet){ open=false; render(); } });
  window.hkDockMore=function(){ open=!open; render(); };
  try{ if(typeof sb!=='undefined'&&sb&&sb.rpc){ sb.rpc('current_can_issue_miamala').then(function(r){ canMiamala=!!(r&&r.data); render(); },function(){}); } }catch(e){}
  function render(){
    var ac=document.getElementById('appContent');
    var shown=!ac||getComputedStyle(ac).display!=='none';
    dock.style.display=shown?'':'none'; if(!shown){ sheet.classList.remove('open'); return; }
    var more=MORE.filter(function(m){ return !m[4]||canMiamala||file===m[0]; });
    var moreOn=open||more.some(function(m){return m[0]===file;});
    var hh=PRIM.map(function(p){ return '<button class="hk-dk '+((p[0]===file&&!open)?'on':'')+'" onclick="window.HkNav?HkNav.go(\''+p[0]+'\'):(location.href=\''+p[0]+'\')" aria-label="'+p[1]+'">'+svg(p[2])+'<span>'+p[1]+'</span></button>'; }).join('');
    hh+='<button class="hk-dk '+(moreOn?'on':'')+'" onclick="hkDockMore()" aria-label="Zaidi">'+svg('dots')+'<span>Zaidi</span></button>';
    dock.style.gridTemplateColumns='repeat(5,minmax(0,1fr))';
    dock.innerHTML=hh;
    sheet.innerHTML='<div class="hk-more-in">'+more.map(function(m){ return '<button class="hk-z '+(m[0]===file?'on':'')+'" onclick="window.HkNav?HkNav.go(\''+m[0]+'\'):(location.href=\''+m[0]+'\')">'+svg(m[2])+'<div class="n">'+m[1]+'</div><div class="s">'+m[3]+'</div></button>'; }).join('')+'</div>';
    sheet.classList.toggle('open',open);
  }
  var q=0; function soon(){ if(q) return; q=requestAnimationFrame(function(){ q=0; render(); }); }
  var ac0=document.getElementById('appContent'); if(ac0) new MutationObserver(soon).observe(ac0,{attributes:true,attributeFilter:['style','class']});
  render(); setTimeout(render,600); setTimeout(render,1800);
})();
</script>
