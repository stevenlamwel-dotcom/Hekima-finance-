<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hekima Finance — Report</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0b0f16; --panel:#121a26; --panel2:#0f1622; --border:#1e2836;
    --cyan:#22d3ee; --cyan-dim:rgba(34,211,238,0.15);
    --green:#34d399; --red:#f87171;
    --text:#e6edf5; --sub:#7c8aa0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:60px;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .topbar h1{font-size:17px;margin:0;font-weight:600;}
  .refresh-btn{background:var(--panel);border:1px solid var(--border);color:var(--cyan);padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;}
  .gendate{font-size:11px;color:var(--sub);margin-bottom:18px;}

  .section{margin-bottom:26px;}
  .section-label{
    text-transform:uppercase;font-size:12px;letter-spacing:1.2px;color:var(--sub);
    font-weight:700;margin:0 0 10px 2px;
  }

  .kpi-row{display:flex;gap:10px;margin-bottom:10px;}
  .kpi{
    flex:1;background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:14px;text-align:center;
  }
  .kpi .n{font-size:20px;font-weight:700;}
  .kpi .l{font-size:11px;color:var(--sub);margin-top:3px;}
  .kpi .n.green{color:var(--green);}
  .kpi .n.red{color:var(--red);}

  .table-wrap{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--panel);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{background:var(--panel2);color:var(--sub);text-transform:uppercase;font-size:10px;letter-spacing:0.5px;padding:9px 10px;text-align:left;}
  tbody td{padding:9px 10px;border-top:1px solid var(--border);}
  tbody tr.total-row td{font-weight:700;border-top:2px solid var(--cyan);}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  td.green{color:var(--green);font-weight:600;}
  td.red{color:var(--red);font-weight:600;}

  .state-msg{text-align:center;color:var(--sub);font-size:13px;padding:30px 0;}

  .auth-gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .login-box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 22px;}
  .login-box h2{margin:0 0 4px;font-size:18px;}
  .login-box p{margin:0 0 18px;font-size:12px;color:var(--sub);}
  .login-input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;font-size:14px;margin-bottom:10px;box-sizing:border-box;}
  .login-btn{width:100%;background:var(--cyan);color:#00202a;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}
  .login-err{color:var(--red);font-size:12px;margin-top:10px;min-height:14px;}
  .logout-link{font-size:11px;color:var(--sub);cursor:pointer;text-decoration:underline;margin-left:10px;}
</style>
</head>
<body>
<div class="auth-gate" id="authGate">
  <div class="login-box">
    <h2>Ingia — Hekima Finance</h2>
    <p>Tumia akaunti yako ya admin kuingia.</p>
    <input class="login-input" id="loginEmail" type="email" placeholder="Email">
    <input class="login-input" id="loginPass" type="password" placeholder="Password">
    <button class="login-btn" onclick="doLogin()">Ingia</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>
<div id="appContent" style="display:none">
<div class="wrap">
  <div class="topbar">
    <h1>Report</h1>
    <button class="refresh-btn" onclick="loadReport()">↻ Onyesha upya</button>
    <span class="logout-link" onclick="doLogout()">Toka</span>
  </div>
  <div class="gendate" id="genDate"></div>

  <div id="reportBody"><div class="state-msg">Inapakia data...</div></div>
</div>

<script>
const SUPABASE_URL = "https://dftsvrxzyakhyadjwhnb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdHN2cnh6eWFraHlhZGp3aG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNDczMzAsImV4cCI6MjEwMDYyMzMzMH0.k07kB77HAtIO-0JUca0b4drc9PyZObwIsZBXIYtfIL4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function tzs(n){ return Math.round(n).toLocaleString('en-US') + " TZS"; }

async function loadReport(){
  document.getElementById('genDate').textContent = "Imetengenezwa: " + new Date().toLocaleString('sw-TZ');
  document.getElementById('reportBody').innerHTML = '<div class="state-msg">Inapakia data...</div>';

  try{
    const [{data: agents, error:e1}, {data: clients, error:e2}, {data: loans, error:e3}, {data: payments, error:e4}] =
      await Promise.all([
        sb.from('mikopo_agents').select('*'),
        sb.from('mikopo_clients').select('*'),
        sb.from('mikopo_loans').select('*'),
        sb.from('mikopo_payments').select('*'),
      ]);
    if(e1) throw e1; if(e2) throw e2; if(e3) throw e3; if(e4) throw e4;

    const clientById = {}; (clients||[]).forEach(c=> clientById[c.id]=c);
    const paidByLoan = {};
    (payments||[]).forEach(p=>{ if(!p.loan_id) return; paidByLoan[p.loan_id]=(paidByLoan[p.loan_id]||0)+Number(p.kiasi||0); });

    const today = new Date();
    // per-agent buckets
    const A = {}; // code -> stats
    (agents||[]).forEach(a=> A[a.code] = {
      name:a.name, clients:0, deniBaki:0, mizuri:0, mibaya:0, active:0, pasive:0
    });

    let clientsWithLoanIds = new Set();

    (loans||[]).forEach(l=>{
      const c = clientById[l.client_id];
      if(!c || !A[c.agent_code]) return;
      const bucket = A[c.agent_code];
      const jumla = Number(l.jumla||0);
      const paid = paidByLoan[l.id] || 0;
      const deniBaki = jumla - paid;

      let mchafu = false;
      if(l.d_kamilisha){
        const d1 = new Date(l.d_kamilisha); d1.setDate(d1.getDate()+1);
        mchafu = today > d1;
      }

      bucket.deniBaki += deniBaki;
      if(mchafu){ bucket.mibaya += 1; bucket.pasive += deniBaki; }
      else { bucket.mizuri += 1; bucket.active += deniBaki; }

      clientsWithLoanIds.add(l.client_id);
    });

    (clients||[]).forEach(c=>{
      if(c.agent_code && A[c.agent_code]) A[c.agent_code].clients += 1;
    });

    const codes = Object.keys(A);
    const totalClients = codes.reduce((s,k)=>s+A[k].clients,0);
    const totalDeni = codes.reduce((s,k)=>s+A[k].deniBaki,0);
    const totalMizuri = codes.reduce((s,k)=>s+A[k].mizuri,0);
    const totalMibaya = codes.reduce((s,k)=>s+A[k].mibaya,0);
    const totalActive = codes.reduce((s,k)=>s+A[k].active,0);
    const totalPasive = codes.reduce((s,k)=>s+A[k].pasive,0);

    // wenye pesa / wasio na pesa (deni baki > 1 vs <=1)
    let wenyePesa = 0, wasioNaPesa = 0;
    (loans||[]).forEach(l=>{
      const jumla = Number(l.jumla||0);
      const paid = paidByLoan[l.id] || 0;
      const deniBaki = jumla - paid;
      if(deniBaki > 1) wenyePesa++; else wasioNaPesa++;
    });

    // by eneo
    const byEneo = {};
    (clients||[]).forEach(c=>{
      const key = c.eneo || "Haijaainishwa";
      byEneo[key] = (byEneo[key]||0) + 1;
    });
    const eneoRows = Object.entries(byEneo).sort((a,b)=> b[1]-a[1]);

    const agentRows = (arr, valFn) => codes.map(k=>`
      <tr><td>${A[k].name}</td><td class="num">${valFn(A[k])}</td></tr>
    `).join('');

    document.getElementById('reportBody').innerHTML = `
      <div class="section">
        <div class="section-label">Muhtasari</div>
        <div class="kpi-row">
          <div class="kpi"><div class="n">${totalClients}</div><div class="l">Jumla Wateja</div></div>
          <div class="kpi"><div class="n">${tzs(totalDeni)}</div><div class="l">Pesa Iliyopo Nje</div></div>
        </div>
        <div class="kpi-row">
          <div class="kpi"><div class="n green">${totalMizuri}</div><div class="l">Mikopo Mizuri</div></div>
          <div class="kpi"><div class="n red">${totalMibaya}</div><div class="l">Mikopo Mibaya</div></div>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Jumla ya Wateja kwa Wakala</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Wakala</th><th style="text-align:right">Wateja</th></tr></thead>
          <tbody>
            ${agentRows(A, a=>a.clients)}
            <tr class="total-row"><td>TOTAL</td><td class="num">${totalClients}</td></tr>
          </tbody>
        </table></div>
      </div>

      <div class="section">
        <div class="section-label">Pesa Iliyopo Nje kwa Wakala</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Wakala</th><th style="text-align:right">Deni Baki</th></tr></thead>
          <tbody>
            ${agentRows(A, a=>tzs(a.deniBaki))}
            <tr class="total-row"><td>TOTAL</td><td class="num">${tzs(totalDeni)}</td></tr>
          </tbody>
        </table></div>
      </div>

      <div class="section">
        <div class="section-label">Mikopo Mizuri na Mibaya kwa Wakala</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Wakala</th><th style="text-align:right">Mizuri</th><th style="text-align:right">Mibaya</th></tr></thead>
          <tbody>
            ${codes.map(k=>`<tr><td>${A[k].name}</td><td class="num green">${A[k].mizuri}</td><td class="num red">${A[k].mibaya}</td></tr>`).join('')}
            <tr class="total-row"><td>TOTAL</td><td class="num green">${totalMizuri}</td><td class="num red">${totalMibaya}</td></tr>
          </tbody>
        </table></div>
      </div>

      <div class="section">
        <div class="section-label">Mtaji Msafi (Active) na Mchafu (Pasive)</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Wakala</th><th style="text-align:right">Msafi</th><th style="text-align:right">Mchafu</th></tr></thead>
          <tbody>
            ${codes.map(k=>`<tr><td>${A[k].name}</td><td class="num green">${tzs(A[k].active)}</td><td class="num red">${tzs(A[k].pasive)}</td></tr>`).join('')}
            <tr class="total-row"><td>TOTAL</td><td class="num green">${tzs(totalActive)}</td><td class="num red">${tzs(totalPasive)}</td></tr>
          </tbody>
        </table></div>
      </div>

      <div class="section">
        <div class="section-label">Wenye Pesa / Wasio na Pesa</div>
        <div class="kpi-row">
          <div class="kpi"><div class="n">${wenyePesa}</div><div class="l">Wenye Deni (bado wanadaiwa)</div></div>
          <div class="kpi"><div class="n">${wasioNaPesa}</div><div class="l">Wamemaliza Kulipa</div></div>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Idadi ya Wateja kwa Maeneo</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Eneo</th><th style="text-align:right">Wateja</th></tr></thead>
          <tbody>
            ${eneoRows.map(([eneo,count])=>`<tr><td>${eneo}</td><td class="num">${count}</td></tr>`).join('')}
          </tbody>
        </table></div>
      </div>
    `;

  } catch(err){
    document.getElementById('reportBody').innerHTML = '<div class="state-msg">Imeshindikana kupakia: '+(err.message||err)+'</div>';
  }
}


async function checkAuth(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){ enterApp(); } else {
    document.getElementById('authGate').style.display='flex';
    document.getElementById('appContent').style.display='none';
  }
}
function enterApp(){
  document.getElementById('authGate').style.display='none';
  document.getElementById('appContent').style.display='block';
  loadReport();
}
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent='';
  const {error} = await sb.auth.signInWithPassword({email,password:pass});
  if(error){ document.getElementById('loginErr').textContent = error.message; return; }
  enterApp();
}
async function doLogout(){
  await sb.auth.signOut();
  location.reload();
}
checkAuth();
</script>
</div>
</body>
</html>
