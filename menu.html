<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hekima Finance</title>
<style>
  :root{
    --bg:#0b0f16; --panel:#121a26; --panel2:#0f1622; --border:#1e2836;
    --cyan:#22d3ee; --cyan-dim:rgba(34,211,238,0.15);
    --text:#e6edf5; --sub:#7c8aa0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:40px 16px;}
  .heading{text-align:center;margin-bottom:32px;}
  .heading .eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:1.5px;color:var(--cyan);font-weight:700;}
  .heading h1{font-size:24px;margin:10px 0 0;}
  .menu{display:grid;gap:14px;}
  .menu-item{
    display:flex;align-items:center;gap:16px;
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:18px;text-decoration:none;color:var(--text);
  }
  .menu-item:active{background:var(--panel2);}
  .icon{
    width:44px;height:44px;border-radius:12px;background:var(--cyan-dim);color:var(--cyan);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;
  }
  .menu-item .label{font-size:15px;font-weight:600;}
  .menu-item .desc{font-size:12.5px;color:var(--sub);margin-top:2px;}
  .chevron{margin-left:auto;color:var(--sub);}
  .footnote{text-align:center;font-size:11px;color:var(--sub);margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="heading">
    <div class="eyebrow">Hekima Finance</div>
    <h1>Idara ya Mikopo</h1>
  </div>

  <div class="menu">
    <a class="menu-item" href="dashboard.html">
      <div class="icon">📊</div>
      <div><div class="label">Dashboard</div><div class="desc">Muhtasari wa mtaji na wakala</div></div>
      <div class="chevron">›</div>
    </a>
    <a class="menu-item" href="cust-list.html">
      <div class="icon">👥</div>
      <div><div class="label">Cust List</div><div class="desc">Wateja, mikopo, wadhamini</div></div>
      <div class="chevron">›</div>
    </a>
    <a class="menu-item" href="refund.html">
      <div class="icon">💵</div>
      <div><div class="label">Refund</div><div class="desc">Marejesho ya kila siku</div></div>
      <div class="chevron">›</div>
    </a>
    <a class="menu-item" href="mkeka.html">
      <div class="icon">🖨️</div>
      <div><div class="label">Mkeka</div><div class="desc">Karatasi ya kuchapisha kwa wakala</div></div>
      <div class="chevron">›</div>
    </a>
    <a class="menu-item" href="report.html">
      <div class="icon">📈</div>
      <div><div class="label">Report</div><div class="desc">Ripoti kamili ya wateja na mitaji</div></div>
      <div class="chevron">›</div>
    </a>
  </div>

  <div class="footnote">menu.html — weka pamoja na hizo tano kwenye folda moja.</div>
</div>
</body>
</html>
