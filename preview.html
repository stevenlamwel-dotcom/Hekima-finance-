<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEKIMA FINANCE — Preview ya muonekano</title>
<style>
:root{--navy:#001848;--navy2:#0b2a5b;--green:#008454;--gold:#cc9c24;--gold2:#d8b460;--mist:#f4f6f8;--line:#dfe4ec;--ink:#001848;--sub:#51606c;--red:#c0392b;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--mist);color:var(--ink);font-size:14px}
.mock{position:fixed;top:0;right:0;background:var(--gold);color:#1d1400;font-size:11px;font-weight:800;padding:3px 10px;border-bottom-left-radius:8px;z-index:99}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--navy);color:#fff;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em;margin-bottom:18px}
.brand img{width:42px;height:42px;background:#fff;border-radius:10px;object-fit:contain;padding:3px}
.grp{font-size:10.5px;letter-spacing:.12em;color:var(--gold2);margin:14px 8px 6px;text-transform:uppercase}
aside a{display:block;color:#dfe6f2;text-decoration:none;padding:8px 10px;border-radius:9px;font-size:13.5px}
aside a:hover{background:rgba(255,255,255,.08)}
aside a.on{background:var(--gold);color:#1d1400;font-weight:700}
main{padding:0 22px 40px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 10px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;color:var(--navy)}
.top small{color:var(--sub)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--navy)}
.seg button.on{background:var(--green);color:#fff}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;background:#fff7e0;color:#7a5a10;border:1px solid #efd9a0}
.ok{background:#e7f5ee;color:#0b6b48;border-color:#bfe3d1}.bad{background:#fbeaea;color:#8a2a22;border-color:#f0c4c0}.wait{background:#eef2fb;color:#1f3f74;border-color:#cdd8ee}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.kpi .l{font-size:12px;color:var(--sub)}.kpi .v{font-size:22px;font-weight:800;color:var(--navy);margin-top:4px}.kpi .s{font-size:11.5px;color:var(--sub)}
.kpi.gold{border-top:3px solid var(--gold)}.kpi.green{border-top:3px solid var(--green)}.kpi.navy{border-top:3px solid var(--navy)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{background:var(--navy);color:#fff;text-align:left;padding:9px 10px;font-weight:700;font-size:12px;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:nth-child(even) td{background:#fafbfd}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
.tot td{background:var(--green)!important;color:#fff;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;border:1px solid #c9d2df;border-radius:9px;padding:9px 10px;background:#fff;color:var(--ink);min-width:0}
.btn{display:inline-block;border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:13px;text-decoration:none}
.btn.g{background:var(--green);color:#fff}.btn.gold{background:var(--gold);color:#1d1400}.btn.o{background:#fff;color:var(--navy);border:1px solid var(--navy)}.btn.r{background:#fff;color:var(--red);border:1px solid var(--red)}
.chip{display:inline-block;padding:6px 12px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:12.5px;margin-right:6px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs span{padding:8px 13px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px;cursor:pointer}
.tabs span.on{background:var(--gold);color:#1d1400;border-color:var(--gold)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.bars div{flex:1;background:var(--green);border-radius:6px 6px 0 0;position:relative;min-width:14px}
.bars div.g{background:var(--gold)}.bars div.n{background:var(--navy)}
.bars b{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--sub)}
.hbar{height:9px;background:var(--line);border-radius:6px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--green)}
.empty{padding:22px;text-align:center;color:var(--sub);border:1px dashed #c9d2df;border-radius:12px;background:#fbfcfe}
.ava{width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--gold2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;margin-right:8px;font-size:13px}
.avg{background:var(--gold);color:#1d1400}
.stripe{background:var(--navy);color:#fff;border-radius:14px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stripe b{color:var(--gold2)}
.sig{display:flex;justify-content:space-between;gap:20px;margin-top:26px}.sig div{flex:1;border-top:1px dotted var(--navy);padding-top:6px;text-align:center;font-style:italic;color:var(--sub)}
.dz{border:2px dashed var(--gold);border-radius:14px;padding:18px;text-align:center;color:#7a5a10;background:#fffbef}
.phone-nav{display:none}
/* ukubwa wa simu */
.phone main{padding:0 12px 80px}.phone .shell{grid-template-columns:1fr}
.phone aside{display:none}
.phone .phone-nav{display:flex;gap:6px;overflow-x:auto;background:var(--navy);padding:10px;position:sticky;top:0;z-index:5}
.phone .phone-nav a{flex:0 0 auto;color:#fff;text-decoration:none;padding:7px 11px;border-radius:9px;font-size:12.5px;background:rgba(255,255,255,.1)}
.phone .phone-nav a.on{background:var(--gold);color:#1d1400;font-weight:700}
.phone .g4,.phone .g3,.phone .g2{grid-template-columns:1fr 1fr}
.phone .top h1{font-size:19px}
.phone .sig{flex-direction:column}
@media print{aside,.seg,.noprint{display:none!important}.shell{display:block}main{padding:0}}
</style></head>

const ORDER=['login','dashboard','balance','combine','updates','clients','refund','mkeka','report','miamala','hr','operations','management','profile'];
const GROUPS={'Kuingia':['login'],'Nyumbani':['dashboard','profile'],'Finance':['balance','combine','updates'],'Mikopo & wateja':['clients','refund','mkeka','miamala'],'Ripoti':['report'],'HR':['hr'],'Operations':['operations'],'Management':['management']};
function nav(cur){
  const side=Object.entries(GROUPS).map(([g,ks])=>`<div class="grp">${g}</div>`+ks.map(k=>`<a href="#${k}" class="${k===cur?'on':''}">${PAGES[k].t}</a>`).join('')).join('');
  document.getElementById('side').innerHTML=`<div class="brand"><img src="assets/hekima-emblem.png" alt="">HEKIMA FINANCE</div>${side}`;
  document.getElementById('side').innerHTML += `<div class="grp">Ukubwa</div><a href="#" onclick="document.body.classList.toggle('phone');render();return false;">Badili: simu / kompyuta</a>`;
}
function phoneNav(cur){ return `<div class="phone-nav">${ORDER.map(k=>`<a href="#${k}" class="${k===cur?'on':''}">${PAGES[k].t}</a>`).join('')}</div>`; }
function render(){
  const k=(location.hash||'#dashboard').slice(1); const key=PAGES[k]?k:'dashboard';
  nav(key);
  const isPhone=document.body.classList.contains('phone');
  document.getElementById('app').innerHTML=(isPhone?phoneNav(key):'')+PAGES[key].r();
  document.title='HEKIMA FINANCE — '+PAGES[key].t;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
render();
</script>
