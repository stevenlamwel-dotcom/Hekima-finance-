<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hekima Finance — Cust List</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0b0f16; --panel:#121a26; --panel2:#0f1622; --border:#1e2836;
    --cyan:#22d3ee; --cyan-dim:rgba(34,211,238,0.15);
    --green:#34d399; --red:#f87171; --text:#e6edf5; --sub:#7c8aa0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:60px;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .topbar h1{font-size:17px;margin:0;font-weight:600;}
  .add-btn{background:var(--cyan);color:#00202a;border:none;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}

  .auth-gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .login-box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 22px;}
  .login-box h2{margin:0 0 4px;font-size:18px;}
  .login-box p{margin:0 0 18px;font-size:12px;color:var(--sub);}
  .login-input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;font-size:14px;margin-bottom:10px;}
  .login-btn{width:100%;background:var(--cyan);color:#00202a;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}
  .login-err{color:var(--red);font-size:12px;margin-top:10px;min-height:14px;}
  .logout-link{font-size:11px;color:var(--sub);cursor:pointer;text-decoration:underline;margin-left:10px;}

  .breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-bottom:14px;}
  .breadcrumb .crumb{cursor:pointer;color:var(--cyan);}
  .breadcrumb .sep{color:var(--sub);}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:flex-start;justify-content:center;padding:20px;z-index:40;overflow-y:auto;}
  .modal-overlay.show{display:flex;}
  .modal-card{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;margin-top:20px;margin-bottom:20px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .modal-head h3{margin:0;font-size:15px;}
  .modal-close{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer;}
  .hint{font-size:11.5px;color:var(--sub);margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;}
  .field input, .field select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;font-size:14px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .subheading{font-size:12px;font-weight:700;color:var(--cyan);margin:16px 0 8px;text-transform:uppercase;letter-spacing:0.5px;}
  .computed-box{background:var(--panel2);border:1px dashed var(--border);border-radius:12px;padding:12px;margin:14px 0;font-size:12.5px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .computed-box div span.l{color:var(--sub);display:block;font-size:10.5px;text-transform:uppercase;}
  .computed-box div span.v{font-weight:700;font-variant-numeric:tabular-nums;}
  .submit-btn{width:100%;background:var(--cyan);color:#00202a;border:none;padding:13px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;}
  .submit-btn:disabled{opacity:0.5;}
  .form-msg{font-size:12.5px;margin-top:10px;min-height:16px;}
  .form-msg.ok{color:var(--green);} .form-msg.err{color:var(--red);}

  .agent-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .agent-tile{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;}
  .agent-tile:active{background:var(--panel2);}
  .agent-tile .code{background:var(--cyan-dim);color:var(--cyan);font-weight:700;font-size:11px;padding:4px 9px;border-radius:7px;display:inline-block;margin-bottom:8px;}
  .agent-tile .name{font-size:14px;font-weight:600;}
  .agent-tile .count{font-size:20px;font-weight:700;margin-top:8px;}
  .agent-tile .lbl{font-size:10.5px;color:var(--sub);text-transform:uppercase;}
  .all-tile{grid-column:1 / -1;background:linear-gradient(180deg,var(--panel),var(--panel2));}
  .acct-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .acct-status{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:7px;}
  .acct-active{background:rgba(52,211,153,0.15);color:var(--green);}
  .acct-inactive{background:rgba(248,113,113,0.15);color:var(--red);}
  .acct-none{background:var(--panel2);color:var(--sub);}
  .acct-toggle{background:var(--panel2);border:1px solid var(--border);color:var(--cyan);padding:4px 10px;border-radius:7px;font-size:10.5px;font-weight:700;cursor:pointer;}

  .search{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:12px;font-size:14px;margin-bottom:12px;}
  .lock-all-btn{width:100%;background:var(--panel2);border:1px solid var(--red);color:var(--red);padding:10px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;margin-bottom:12px;}
  .list-summary{font-size:12px;color:var(--sub);margin-bottom:10px;}
  .row-item{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
  .row-item:active{background:var(--panel2);}
  .row-no{font-size:11px;color:var(--sub);width:30px;flex-shrink:0;}
  .row-main{flex:1;min-width:0;}
  .row-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-sub{font-size:11.5px;color:var(--sub);margin-top:1px;}
  .row-deni{text-align:right;flex-shrink:0;}
  .row-deni .v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
  .row-deni .v.green{color:var(--green);} .row-deni .v.red{color:var(--red);}
  .chevron{color:var(--sub);flex-shrink:0;}

  .pager{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
  .pager button{background:var(--panel);border:1px solid var(--border);color:var(--cyan);padding:9px 16px;border-radius:10px;font-size:13px;cursor:pointer;}
  .pager button:disabled{opacity:0.35;cursor:default;}
  .pager .info{font-size:12px;color:var(--sub);}

  .detail-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;}
  .detail-name{font-size:18px;font-weight:700;}
  .detail-maarufu{font-size:12.5px;color:var(--sub);margin-top:2px;}
  .status-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;display:inline-block;margin-top:8px;}
  .status-safi{background:rgba(52,211,153,0.15);color:var(--green);}
  .status-chafu{background:rgba(248,113,113,0.15);color:var(--red);}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;border-top:1px solid var(--border);}
  .detail-cell{padding:10px 0;border-bottom:1px solid var(--border);}
  .detail-cell:nth-child(odd){padding-right:10px;}
  .detail-lbl{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:0.5px;}
  .detail-val{font-size:14px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;}
  .section-title{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:0.6px;margin:18px 0 8px;}
  .guarantor-item, .payment-item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .back-btn{background:var(--panel);border:1px solid var(--border);color:var(--cyan);padding:9px 16px;border-radius:10px;font-size:13px;cursor:pointer;margin-bottom:14px;}

  .detail-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .edit-btn{background:var(--cyan);color:#00202a;border:none;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
  .lock-toggle-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
  .locked-note{font-size:12px;color:var(--sub);font-style:italic;padding:10px 0;}
  .lock-badge{background:rgba(251,191,36,0.15);color:#fbbf24;margin-left:8px;}
  .mini-del-btn{background:none;border:1px solid var(--border);color:var(--red);padding:3px 9px;border-radius:7px;font-size:10.5px;cursor:pointer;}
  .audit-item{padding:9px 0;border-bottom:1px solid var(--border);}
  .audit-top{display:flex;justify-content:space-between;font-size:12.5px;}
  .audit-action{font-weight:700;text-transform:uppercase;font-size:10.5px;padding:2px 7px;border-radius:6px;}
  .audit-action.update{background:rgba(34,211,238,0.15);color:var(--cyan);}
  .audit-action.delete{background:rgba(248,113,113,0.15);color:var(--red);}
  .audit-date{color:var(--sub);}
  .audit-by{font-size:11px;color:var(--sub);margin-top:2px;}

  .state-msg{text-align:center;color:var(--sub);font-size:13px;padding:30px 0;}
</style>
</head>
<body>

<div class="auth-gate" id="authGate">
  <div class="login-box">
    <h2>Ingia — Hekima Finance</h2>
    <p>Tumia akaunti yako kuingia.</p>
    <input class="login-input" id="loginEmail" type="email" placeholder="Email">
    <input class="login-input" id="loginPass" type="password" placeholder="Password">
    <button class="login-btn" onclick="doLogin()">Ingia</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="appContent" style="display:none">
<div class="wrap">
  <div class="topbar">
    <h1>Cust List</h1>
    <div style="display:flex;gap:8px;align-items:center;">
      <a href="index.html" style="color:var(--cyan);text-decoration:none;font-size:13px;">‹ Menu</a>
      <button class="add-btn" onclick="openAddForm()">+ Mteja</button>
      <span class="logout-link" onclick="doLogout()">Toka</span>
    </div>
  </div>
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="mainArea"><div class="state-msg">Inapakia data...</div></div>
</div>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal-card">
    <div class="modal-head"><h3>Sajili Mteja Mpya</h3><button class="modal-close" onclick="closeAddForm()">×</button></div>
    <div class="hint">Jaza taarifa za mkopo — mahesabu ya riba/rejesho yanafanyika moja kwa moja.</div>

    <div class="field"><label>Jina Kamili</label><input id="fJina" placeholder="Jina la mteja"></div>
    <div class="row2">
      <div class="field"><label>Maarufu</label><input id="fMaarufu" placeholder="Jina la utani"></div>
      <div class="field"><label>Simu</label><input id="fSimu" placeholder="07XXXXXXXX"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Eneo</label><input id="fEneo" placeholder="Eneo"></div>
      <div class="field"><label>Kikundi</label><input id="fKikundi" placeholder="Kikundi (hiari)"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Mteja</label><select id="fMteja"><option value="MPYA">MPYA</option><option value="ZAMANI">ZAMANI</option></select></div>
      <div class="field"><label>Wakala</label><select id="fAgent"></select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Mkopo (TZS)</label><input id="fMkopo" type="number" placeholder="100000" oninput="updateComputed()"></div>
      <div class="field"><label>Tarehe ya Kupewa</label><input id="fDkupewa" type="date"></div>
    </div>

    <div class="computed-box" id="computedBox">
      <div><span class="l">Riba (20%)</span><span class="v" id="cRiba">0</span></div>
      <div><span class="l">Riba2 (mpya, 10%)</span><span class="v" id="cRiba2">0</span></div>
      <div><span class="l">Jumla</span><span class="v" id="cJumla">0</span></div>
      <div><span class="l">Rejesho/Siku</span><span class="v" id="cRejesho">0</span></div>
      <div><span class="l">D.Kuanza</span><span class="v" id="cKuanza">—</span></div>
      <div><span class="l">D.Kamilisha</span><span class="v" id="cKamilisha">—</span></div>
    </div>

    <div class="subheading">Mdhamini</div>
    <div class="row2">
      <div class="field"><label>Jina</label><input id="mJina" placeholder="Jina la mdhamini"></div>
      <div class="field"><label>Simu</label><input id="mSimu" placeholder="07XXXXXXXX"></div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitClient()">Hifadhi Mteja</button>
    <div class="form-msg" id="formMsg"></div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal-card">
    <div class="modal-head"><h3>Hariri Mteja</h3><button class="modal-close" onclick="closeEditForm()">×</button></div>

    <div class="field"><label>Jina Kamili</label><input id="eJina" placeholder="Jina la mteja"></div>
    <div class="row2">
      <div class="field"><label>Maarufu</label><input id="eMaarufu" placeholder="Jina la utani"></div>
      <div class="field"><label>Simu</label><input id="eSimu" placeholder="07XXXXXXXX"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Eneo</label><input id="eEneo" placeholder="Eneo"></div>
      <div class="field"><label>Kikundi</label><input id="eKikundi" placeholder="Kikundi (hiari)"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Mteja</label><select id="eMteja"><option value="MPYA">MPYA</option><option value="ZAMANI">ZAMANI</option></select></div>
      <div class="field"><label>Mkopo (TZS)</label><input id="eMkopo" type="number" placeholder="100000"></div>
    </div>
    <div class="field"><label>Tarehe ya Kupewa</label><input id="eDkupewa" type="date"></div>

    <div class="subheading">Mdhamini</div>
    <div class="row2">
      <div class="field"><label>Jina</label><input id="eMJina" placeholder="Jina la mdhamini"></div>
      <div class="field"><label>Simu</label><input id="eMSimu" placeholder="07XXXXXXXX"></div>
    </div>

    <button class="submit-btn" id="editSubmitBtn" onclick="submitEdit()">Hifadhi Mabadiliko</button>
    <div class="form-msg" id="editMsg"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://euhteovuhdvefzaavlqx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1aHRlb3Z1aGR2ZWZ6YWF2bHF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjQwNjEsImV4cCI6MjA5NzE0MDA2MX0.gaV1mShFhVHVpxAqCptJsiSr4r-d3_OYvdtH0bpR58Q";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const DAY = 86400000;

const PAGE_SIZE = 30;
let AGENTS = [];
let ME = null;
let state = { view:'agents', agentCode:null, page:0, search:'' };

function tzs(n){ return Math.round(n).toLocaleString('en-US') + " TZS"; }
function fmtDate(d){ if(!d) return "—"; return new Date(d).toLocaleDateString('sw-TZ',{day:'2-digit',month:'short',year:'numeric'}); }
function statusOf(c){ return (Date.now() > Date.parse(c.d_kamilisha) + DAY) ? 'chafu' : 'safi'; }
function deniBaki(c){ return Math.max(0, Number(c.jumla) - (c.mikopo_payments||[]).reduce((s,p)=>s+Number(p.kiasi),0)); }

// ---------- Add-client form ----------
function openAddForm(){ document.getElementById('addModal').classList.add('show'); }
function closeAddForm(){ document.getElementById('addModal').classList.remove('show'); }

function updateComputed(){
  const mkopo = Number(document.getElementById('fMkopo').value || 0);
  const mteja = document.getElementById('fMteja').value;
  const dKupewaVal = document.getElementById('fDkupewa').value;
  const riba = mkopo * 0.2;
  const riba2 = mteja === "MPYA" ? mkopo * 0.1 : 0;
  const jumla = mkopo + riba + riba2;
  const rejesho = mkopo / 25;
  document.getElementById('cRiba').textContent = tzs(riba);
  document.getElementById('cRiba2').textContent = tzs(riba2);
  document.getElementById('cJumla').textContent = tzs(jumla);
  document.getElementById('cRejesho').textContent = tzs(rejesho);
  if(dKupewaVal){
    const dKupewa = new Date(dKupewaVal + "T00:00:00");
    const dKuanza = new Date(dKupewa.getTime() + 2*DAY);
    const dKamilisha = new Date(dKuanza.getTime() + 60*DAY);
    document.getElementById('cKuanza').textContent = fmtDate(dKuanza);
    document.getElementById('cKamilisha').textContent = fmtDate(dKamilisha);
  } else {
    document.getElementById('cKuanza').textContent = "—";
    document.getElementById('cKamilisha').textContent = "—";
  }
}

async function submitClient(){
  const msg = document.getElementById('formMsg');
  msg.className='form-msg'; msg.textContent='';
  const jina = document.getElementById('fJina').value.trim();
  const mkopo = Number(document.getElementById('fMkopo').value || 0);
  const agentCode = document.getElementById('fAgent').value;
  const dKupewaVal = document.getElementById('fDkupewa').value;
  if(!jina || !mkopo || !agentCode || !dKupewaVal){
    msg.className='form-msg err'; msg.textContent='Jaza Jina, Mkopo, Wakala na Tarehe ya Kupewa.';
    return;
  }
  document.getElementById('submitBtn').disabled = true;
  try{
    const mteja = document.getElementById('fMteja').value;
    const riba = mkopo*0.2, riba2 = mteja==="MPYA"?mkopo*0.1:0, jumla = mkopo+riba+riba2, rejesho = mkopo/25;
    const dKupewa = new Date(dKupewaVal + "T00:00:00");
    const dKuanza = new Date(dKupewa.getTime()+2*DAY);
    const dKamilisha = new Date(dKuanza.getTime()+60*DAY);

    const { error } = await sb.from('mikopo_clients').insert({
      jina, maarufu: document.getElementById('fMaarufu').value.trim() || null,
      simu: document.getElementById('fSimu').value.trim() || null,
      eneo: document.getElementById('fEneo').value.trim() || null,
      kikundi: document.getElementById('fKikundi').value.trim() || null,
      mteja, agent_code: agentCode, mkopo, riba, riba2, jumla, rejesho_lengo: rejesho,
      d_kupewa: dKupewa.toISOString(), d_kuanza: dKuanza.toISOString(), d_kamilisha: dKamilisha.toISOString(),
      mdhamini_jina: document.getElementById('mJina').value.trim() || null,
      mdhamini_simu: document.getElementById('mSimu').value.trim() || null
    });
    if(error) throw error;

    msg.className='form-msg ok'; msg.textContent='✓ Mteja amehifadhiwa.';
    ['fJina','fMaarufu','fSimu','fEneo','fKikundi','fMkopo','mJina','mSimu'].forEach(id=> document.getElementById(id).value='');
    updateComputed();
    setTimeout(()=>{ closeAddForm(); if(state.view==='list') fetchAndRenderList(); else loadAgents(); }, 700);
  } catch(err){
    msg.className='form-msg err'; msg.textContent='Hitilafu: '+(err.message||err);
  } finally {
    document.getElementById('submitBtn').disabled = false;
  }
}

// ---------- Breadcrumb ----------
function renderBreadcrumb(){
  const el = document.getElementById('breadcrumb');
  if(state.view==='agents'){ el.innerHTML=''; return; }
  const isAdmin = ME && ME.role === 'admin';
  let parts = isAdmin ? [`<span class="crumb" onclick="loadAgents()">Mawakala</span>`] : [`<span>Wateja Wangu</span>`];
  if(state.view==='list' && isAdmin){
    const label = state.agentCode ? (AGENTS.find(a=>a.code===state.agentCode)?.name || state.agentCode) : 'Wateja Wote';
    parts.push(`<span class="sep">›</span><span>${label}</span>`);
  }
  if(state.view==='detail'){
    const label = state.agentCode ? (AGENTS.find(a=>a.code===state.agentCode)?.name || state.agentCode) : 'Wateja Wote';
    if(isAdmin) parts.push(`<span class="sep">›</span><span class="crumb" onclick="loadList()">${label}</span>`);
    parts.push(`<span class="sep">›</span><span>Taarifa</span>`);
  }
  el.innerHTML = parts.join('');
}

// ---------- Agents view ----------
async function loadAgents(){
  state.view='agents'; state.agentCode=null; state.page=0;
  renderBreadcrumb();
  const area = document.getElementById('mainArea');
  area.innerHTML = '<div class="state-msg">Inapakia mawakala...</div>';
  try{
    const { data: agents, error } = await sb.from('mikopo_agents').select('*').order('code');
    if(error) throw error;
    AGENTS = agents || [];
    const [{count: totalCount}, ...perAgent] = await Promise.all([
      sb.from('mikopo_clients').select('*', {count:'exact', head:true}),
      ...AGENTS.map(a => sb.from('mikopo_clients').select('*', {count:'exact', head:true}).eq('agent_code', a.code))
    ]);

    let profilesByAgent = {};
    if(ME && ME.role === 'admin'){
      const { data: profiles } = await sb.from('mikopo_profiles').select('*').not('agent_code','is',null);
      (profiles||[]).forEach(p=>{ profilesByAgent[p.agent_code] = p; });
    }

    const tiles = AGENTS.map((a,i)=>{
      const prof = profilesByAgent[a.code];
      const accountBadge = prof
        ? `<div class="acct-row" onclick="event.stopPropagation()">
             <span class="acct-status ${prof.active ? 'acct-active' : 'acct-inactive'}">${prof.active ? 'Akaunti Hai' : 'Imezimwa'}</span>
             <button class="acct-toggle" onclick="toggleAgentAccount('${prof.id}', ${!prof.active})">${prof.active ? 'Zima' : 'Washa'}</button>
           </div>`
        : (ME && ME.role === 'admin' ? `<div class="acct-row"><span class="acct-status acct-none">Hana akaunti</span></div>` : '');
      return `
      <div class="agent-tile" onclick="loadList('${a.code}')">
        <span class="code">${a.code}</span><div class="name">${a.name}</div>
        <div class="count">${perAgent[i].count ?? 0}</div><div class="lbl">Wateja</div>
        ${accountBadge}
      </div>`;
    }).join('');
    area.innerHTML = `<div class="agent-grid">
      <div class="agent-tile all-tile" onclick="loadList(null)">
        <span class="code">WOTE</span><div class="name">Wateja Wote</div>
        <div class="count">${totalCount ?? 0}</div><div class="lbl">Jumla ya Wateja</div>
      </div>${tiles}</div>`;
  } catch(err){
    area.innerHTML = '<div class="state-msg">Imeshindikana kupakia: '+(err.message||err)+'</div>';
  }
}

async function toggleAgentAccount(profileId, newActive){
  try{
    const { error } = await sb.from('mikopo_profiles').update({ active: newActive }).eq('id', profileId);
    if(error) throw error;
    loadAgents();
  } catch(err){
    alert('Imeshindikana: ' + (err.message || err));
  }
}

// ---------- Client list (paginated) ----------
async function loadList(agentCode){
  if(agentCode !== undefined){ state.agentCode = agentCode; state.page = 0; state.search=''; }
  state.view = 'list';
  renderBreadcrumb();
  const area = document.getElementById('mainArea');
  const isAdmin = ME && ME.role === 'admin';
  area.innerHTML = `
    <input class="search" id="searchBox" placeholder="Tafuta jina, simu, maarufu..." value="${state.search}">
    ${isAdmin ? `<button class="lock-all-btn" onclick="lockAllVisible()">🔒 Funga Wote (${state.agentCode || 'Wateja Wote'})</button>` : ''}
    <div class="list-summary" id="listSummary">Inapakia...</div>
    <div id="rowsArea"><div class="state-msg">Inapakia data...</div></div>
    <div class="pager" id="pagerArea"></div>`;
  document.getElementById('searchBox').addEventListener('input', debounce(e=>{
    state.search = e.target.value; state.page = 0; fetchAndRenderList();
  }, 350));
  await fetchAndRenderList();
}

async function lockAllVisible(){
  const scopeLabel = state.agentCode || 'WATEJA WOTE';
  if(!confirm(`Una uhakika unataka kufunga wateja wote wa ${scopeLabel}? Wakala hataweza tena kuhariri taarifa zao za msingi.`)) return;
  try{
    let query = sb.from('mikopo_clients').update({ locked: true, locked_at: new Date().toISOString(), locked_by: (await sb.auth.getUser()).data.user.id }).eq('locked', false);
    if(state.agentCode) query = query.eq('agent_code', state.agentCode);
    const { data, error } = await query.select('id');
    if(error) throw error;
    alert(`Wateja ${(data||[]).length} wamefungwa.`);
    fetchAndRenderList();
  } catch(err){
    alert('Imeshindikana: ' + (err.message || err));
  }
}

let debounceTimer;
function debounce(fn, ms){ return (...args)=>{ clearTimeout(debounceTimer); debounceTimer=setTimeout(()=>fn(...args), ms); }; }

async function fetchAndRenderList(){
  const rowsArea = document.getElementById('rowsArea');
  rowsArea.innerHTML = '<div class="state-msg">Inapakia data...</div>';
  try{
    let query = sb.from('mikopo_clients').select('*, mikopo_payments(*)', {count:'exact'});
    if(state.agentCode) query = query.eq('agent_code', state.agentCode);
    if(state.search){
      const s = state.search.replace(/[%,]/g,'');
      query = query.or(`jina.ilike.%${s}%,simu.ilike.%${s}%,maarufu.ilike.%${s}%`);
    }
    query = query.order('created_at', {ascending:true}).range(state.page*PAGE_SIZE, state.page*PAGE_SIZE+PAGE_SIZE-1);
    const { data: clients, count, error } = await query;
    if(error) throw error;
    state.totalCount = count || 0;

    document.getElementById('listSummary').textContent = state.totalCount===0 ? 'Hakuna wateja.' :
      `Inaonyesha ${state.page*PAGE_SIZE+1}-${Math.min(state.page*PAGE_SIZE+PAGE_SIZE, state.totalCount)} kati ya ${state.totalCount}`;

    const rows = (clients||[]).map((c, idx)=>({
      no: state.page*PAGE_SIZE+idx+1, id:c.id, jina:c.jina, maarufu:c.maarufu, simu:c.simu,
      agentCode:c.agent_code, deniBaki: deniBaki(c), mchafu: statusOf(c)==='chafu', locked: c.locked
    }));

    rowsArea.innerHTML = rows.length===0 ? '<div class="state-msg">Hakuna wateja wanaolingana.</div>' :
      rows.map(r=>`
        <div class="row-item" onclick="loadDetail('${r.id}')">
          <div class="row-no">#${r.no}</div>
          <div class="row-main">
            <div class="row-name">${r.locked ? '🔒 ' : ''}${r.jina}</div>
            <div class="row-sub">${r.maarufu ? r.maarufu+' · ' : ''}${r.simu || 'Hakuna simu'}${!state.agentCode ? ' · '+r.agentCode : ''}</div>
          </div>
          <div class="row-deni"><div class="v ${r.mchafu?'red':'green'}">${tzs(r.deniBaki)}</div></div>
          <div class="chevron">›</div>
        </div>`).join('');

    const totalPages = Math.max(1, Math.ceil(state.totalCount / PAGE_SIZE));
    document.getElementById('pagerArea').innerHTML = `
      <button onclick="changePage(-1)" ${state.page<=0?'disabled':''}>‹ Nyuma</button>
      <span class="info">Ukurasa ${state.page+1} / ${totalPages}</span>
      <button onclick="changePage(1)" ${state.page>=totalPages-1?'disabled':''}>Mbele ›</button>`;
  } catch(err){
    rowsArea.innerHTML = '<div class="state-msg">Imeshindikana kupakia: '+(err.message||err)+'</div>';
  }
}

function changePage(delta){ state.page += delta; fetchAndRenderList(); window.scrollTo({top:0, behavior:'smooth'}); }

// ---------- Client detail ----------
let CURRENT_DETAIL = null;

async function loadDetail(clientId){
  state.view='detail';
  renderBreadcrumb();
  const area = document.getElementById('mainArea');
  area.innerHTML = '<div class="state-msg">Inapakia taarifa...</div>';
  try{
    const { data: c, error } = await sb.from('mikopo_clients').select('*, mikopo_payments(*)').eq('id', clientId).single();
    if(error) throw error;
    CURRENT_DETAIL = c;
    const isAdmin = ME && ME.role === 'admin';
    const canEdit = isAdmin || !c.locked;

    const agentName = (AGENTS.find(a=>a.code===c.agent_code)||{}).name || c.agent_code || '—';
    const bal = deniBaki(c);
    const mchafu = statusOf(c)==='chafu';
    const payments = (c.mikopo_payments||[]).slice().sort((a,b)=> new Date(b.tarehe)-new Date(a.tarehe)).slice(0,15);

    const paymentHtml = payments.length
      ? payments.map(p=>`
          <div class="payment-item">
            <span>${fmtDate(p.tarehe)}</span>
            <span style="display:flex;align-items:center;gap:8px;">
              <span style="color:var(--green);font-weight:600">${tzs(Number(p.kiasi||0))}</span>
              <button class="mini-del-btn" onclick="editPayment('${p.id}', ${Number(p.kiasi)})">Hariri</button>
              <button class="mini-del-btn" onclick="deletePayment('${p.id}')">Futa</button>
            </span>
          </div>`).join('')
      : '<div class="state-msg">Hakuna malipo yaliyorekodiwa.</div>';

    let auditHtml = '';
    if(isAdmin){
      const { data: logs } = await sb.from('audit_log').select('*')
        .or(`record_id.eq.${clientId},old_data->>client_id.eq.${clientId},new_data->>client_id.eq.${clientId}`)
        .order('created_at', {ascending:false}).limit(15);
      auditHtml = `
        <div class="section-title">Historia ya Mabadiliko</div>
        ${(logs||[]).length ? logs.map(l=>`
          <div class="audit-item">
            <div class="audit-top"><span class="audit-action ${l.action}">${l.action==='update'?'Hariri':'Futa'} · ${l.table_name==='mikopo_payments'?'Malipo':'Mteja'}</span><span class="audit-date">${fmtDate(l.created_at)}</span></div>
            <div class="audit-by">${l.changed_by_email || 'haijulikani'}</div>
          </div>`).join('') : '<div class="state-msg">Hakuna historia bado.</div>'}
      `;
    }

    area.innerHTML = `
      <button class="back-btn" onclick="loadList()">‹ Rudi kwenye orodha</button>
      <div class="detail-card">
        <div class="detail-name">${c.locked ? '🔒 ' : ''}${c.jina}</div>
        ${c.maarufu ? `<div class="detail-maarufu">${c.maarufu}</div>` : ''}
        <div class="detail-maarufu">${c.simu || 'Hakuna simu'} · ${c.eneo || '—'} · ${agentName}${c.kikundi ? ' · '+c.kikundi : ''}</div>
        <span class="status-badge ${mchafu?'status-chafu':'status-safi'}">${mchafu?'MCHAFU':'SAFI'} · ${c.mteja}</span>
        ${c.locked ? `<span class="status-badge lock-badge">🔒 IMEFUNGWA</span>` : ''}
        <div class="detail-grid">
          <div class="detail-cell"><div class="detail-lbl">Mkopo</div><div class="detail-val">${tzs(Number(c.mkopo))}</div></div>
          <div class="detail-cell"><div class="detail-lbl">Jumla</div><div class="detail-val">${tzs(Number(c.jumla))}</div></div>
          <div class="detail-cell"><div class="detail-lbl">Deni Baki</div><div class="detail-val">${tzs(bal)}</div></div>
          <div class="detail-cell"><div class="detail-lbl">Rejesho/Siku</div><div class="detail-val">${tzs(Number(c.rejesho_lengo))}</div></div>
          <div class="detail-cell"><div class="detail-lbl">D.Kupewa</div><div class="detail-val">${fmtDate(c.d_kupewa)}</div></div>
          <div class="detail-cell"><div class="detail-lbl">D.Kamilisha</div><div class="detail-val">${fmtDate(c.d_kamilisha)}</div></div>
        </div>
        <div class="detail-actions">
          ${canEdit ? `<button class="edit-btn" onclick="openEditForm()">✎ Hariri</button>` : `<div class="locked-note">Imefungwa na msimamizi — hairitiwa tena.</div>`}
          ${isAdmin ? `<button class="lock-toggle-btn" onclick="toggleLockOne('${c.id}', ${!c.locked})">${c.locked ? '🔓 Fungua' : '🔒 Funga'}</button>` : ''}
        </div>
      </div>
      <div class="section-title">Mdhamini</div>
      ${c.mdhamini_jina ? `<div class="guarantor-item"><span>${c.mdhamini_jina}</span><span style="color:var(--sub)">${c.mdhamini_simu||'—'}</span></div>` : '<div class="state-msg">Hakuna mdhamini aliyesajiliwa.</div>'}
      <div class="section-title">Malipo ya Hivi Karibuni</div>
      ${paymentHtml}
      ${auditHtml}
    `;
  } catch(err){
    area.innerHTML = '<div class="state-msg">Imeshindikana kupakia: '+(err.message||err)+'</div>';
  }
}

async function toggleLockOne(clientId, newLocked){
  try{
    const { data: { user } } = await sb.auth.getUser();
    const { error } = await sb.from('mikopo_clients').update({
      locked: newLocked, locked_at: new Date().toISOString(), locked_by: user.id
    }).eq('id', clientId);
    if(error) throw error;
    loadDetail(clientId);
  } catch(err){
    alert('Imeshindikana: ' + (err.message || err));
  }
}

async function editPayment(paymentId, currentAmount){
  const input = prompt('Kiasi kipya cha malipo (TZS):', currentAmount);
  if(input === null) return;
  const kiasi = Number(input);
  if(!kiasi || kiasi <= 0){ alert('Kiasi si sahihi.'); return; }
  try{
    const { error } = await sb.from('mikopo_payments').update({ kiasi }).eq('id', paymentId);
    if(error) throw error;
    loadDetail(CURRENT_DETAIL.id);
  } catch(err){
    alert('Imeshindikana: ' + (err.message || err));
  }
}

async function deletePayment(paymentId){
  if(!confirm('Una uhakika unataka kufuta malipo haya?')) return;
  try{
    const { error } = await sb.from('mikopo_payments').delete().eq('id', paymentId);
    if(error) throw error;
    loadDetail(CURRENT_DETAIL.id);
  } catch(err){
    alert('Imeshindikana: ' + (err.message || err));
  }
}

// ---------- Edit client form ----------
function openEditForm(){
  const c = CURRENT_DETAIL;
  document.getElementById('eJina').value = c.jina || '';
  document.getElementById('eMaarufu').value = c.maarufu || '';
  document.getElementById('eSimu').value = c.simu || '';
  document.getElementById('eEneo').value = c.eneo || '';
  document.getElementById('eKikundi').value = c.kikundi || '';
  document.getElementById('eMteja').value = c.mteja || 'MPYA';
  document.getElementById('eMkopo').value = c.mkopo || '';
  document.getElementById('eDkupewa').value = c.d_kupewa ? c.d_kupewa.slice(0,10) : '';
  document.getElementById('eMJina').value = c.mdhamini_jina || '';
  document.getElementById('eMSimu').value = c.mdhamini_simu || '';
  document.getElementById('editMsg').textContent = '';
  document.getElementById('editModal').classList.add('show');
}
function closeEditForm(){ document.getElementById('editModal').classList.remove('show'); }

async function submitEdit(){
  const msg = document.getElementById('editMsg');
  msg.className='form-msg'; msg.textContent='';
  const jina = document.getElementById('eJina').value.trim();
  const mkopo = Number(document.getElementById('eMkopo').value || 0);
  const dKupewaVal = document.getElementById('eDkupewa').value;
  if(!jina || !mkopo || !dKupewaVal){
    msg.className='form-msg err'; msg.textContent='Jaza Jina, Mkopo na Tarehe ya Kupewa.';
    return;
  }
  document.getElementById('editSubmitBtn').disabled = true;
  try{
    const mteja = document.getElementById('eMteja').value;
    const riba = mkopo*0.2, riba2 = mteja==="MPYA"?mkopo*0.1:0, jumla = mkopo+riba+riba2, rejesho = mkopo/25;
    const dKupewa = new Date(dKupewaVal + "T00:00:00");
    const dKuanza = new Date(dKupewa.getTime()+2*DAY);
    const dKamilisha = new Date(dKuanza.getTime()+60*DAY);

    const { error } = await sb.from('mikopo_clients').update({
      jina, maarufu: document.getElementById('eMaarufu').value.trim() || null,
      simu: document.getElementById('eSimu').value.trim() || null,
      eneo: document.getElementById('eEneo').value.trim() || null,
      kikundi: document.getElementById('eKikundi').value.trim() || null,
      mteja, mkopo, riba, riba2, jumla, rejesho_lengo: rejesho,
      d_kupewa: dKupewa.toISOString(), d_kuanza: dKuanza.toISOString(), d_kamilisha: dKamilisha.toISOString(),
      mdhamini_jina: document.getElementById('eMJina').value.trim() || null,
      mdhamini_simu: document.getElementById('eMSimu').value.trim() || null
    }).eq('id', CURRENT_DETAIL.id);
    if(error) throw error;

    msg.className='form-msg ok'; msg.textContent='✓ Imesasishwa.';
    setTimeout(()=>{ closeEditForm(); loadDetail(CURRENT_DETAIL.id); }, 600);
  } catch(err){
    msg.className='form-msg err'; msg.textContent='Hitilafu: '+(err.message||err);
  } finally {
    document.getElementById('editSubmitBtn').disabled = false;
  }
}

// ---------- Auth ----------
async function isCurrentUserAdmin(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user) return false;
  const { data: profile } = await sb.from('mikopo_profiles').select('*').eq('id', user.id).single();
  ME = profile;
  return !!(profile && profile.role === 'admin' && profile.active);
}

async function checkAuth(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){
    if(await isCurrentUserAdmin()){ enterApp(); }
    else {
      await sb.auth.signOut();
      document.getElementById('authGate').style.display='flex';
      document.getElementById('appContent').style.display='none';
      document.getElementById('loginErr').textContent = 'Huna ruhusa ya kuingia hapa — ukurasa huu ni kwa admin pekee.';
    }
  } else {
    document.getElementById('authGate').style.display='flex';
    document.getElementById('appContent').style.display='none';
  }
}
function enterApp(){
  document.getElementById('authGate').style.display='none';
  document.getElementById('appContent').style.display='block';
  document.getElementById('fDkupewa').valueAsDate = new Date();
  updateComputed();

  (async ()=>{
    const { data: agentsData } = await sb.from('mikopo_agents').select('*').order('code');
    AGENTS = agentsData || [];
    document.getElementById('fAgent').innerHTML = AGENTS.map(a=>`<option value="${a.code}">${a.name} (${a.code})</option>`).join('');
    loadAgents();
  })();
}
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent='';
  const {error} = await sb.auth.signInWithPassword({email,password:pass});
  if(error){ document.getElementById('loginErr').textContent = error.message; return; }
  if(await isCurrentUserAdmin()){ enterApp(); }
  else {
    await sb.auth.signOut();
    document.getElementById('loginErr').textContent = 'Huna ruhusa ya kuingia hapa — ukurasa huu ni kwa admin pekee.';
  }
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }
checkAuth();
</script>
