<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hekima Finance — Combine</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0a1f36; --panel:#123152; --panel2:#0e2743; --border:#1f3f61;
    --gold:#c89a3d; --gold-dim:rgba(200,154,61,0.16); --green:#1f9d74; --red:#e2645a;
    --text:#eef2f6; --sub:#93a7ba;
  }
  html[data-theme="light"]{ --bg:#f6f3ea; --panel:#ffffff; --panel2:#eceee6; --border:#e4e1d4; --text:#12202f; --sub:#51606c; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:96px;}
  .wrap{max-width:760px;margin:0 auto;padding:14px 12px 30px;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:1px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
  .topbar h1{font-size:16px;margin:0;font-weight:800;}
  .topbar .role{font-size:11px;color:var(--sub);margin-top:2px;}
  .back-link{color:var(--gold);text-decoration:none;font-size:13px;font-weight:600;}
  .icon-toggle-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;}

  .auth-gate{position:fixed;inset:0;background:linear-gradient(160deg,#0a1f36 0%,#123152 60%,#0a1f36 100%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .auth-loading{color:#dbe3ea;font-size:13px;text-align:center;max-width:320px;line-height:1.5;}
  .auth-loading button{margin-top:14px;}

  .datebar{display:flex;gap:6px;align-items:stretch;margin-bottom:6px;}
  .datebar input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:9px;font-size:14px;}
  .datebar button{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:0 12px;font-size:15px;font-weight:700;cursor:pointer;}
  .datebar button.today{font-size:12px;}
  .datelabel{font-size:12px;color:var(--sub);margin:0 2px 12px;min-height:15px;}

  .banner{display:none;background:rgba(226,100,90,0.13);border:1px solid var(--red);color:var(--text);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.45;}
  .banner.info{background:var(--gold-dim);border-color:var(--gold);}

  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px;}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:8px 9px;min-width:0;}
  .kpi .lbl{font-size:10.5px;color:var(--sub);}
  .kpi .val{font-size:14px;font-weight:800;margin-top:2px;overflow-wrap:anywhere;}

  details.sec{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:9px;overflow:hidden;}
  details.sec>summary{padding:13px 14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:13.5px;}
  details.sec>summary::-webkit-details-marker{display:none;}
  details.sec>summary::after{content:"›";color:var(--sub);font-size:18px;transform:rotate(90deg);margin-left:2px;}
  details.sec[open]>summary::after{transform:rotate(-90deg);}
  details.sec>summary .st{flex:1;min-width:0;}
  details.sec>summary .sr{display:flex;align-items:center;gap:7px;}
  .sv{font-size:12.5px;color:var(--gold);font-weight:800;}
  .badge{font-size:10.5px;font-weight:800;color:#fff;background:var(--red);border-radius:20px;padding:2px 8px;display:none;}
  .sec-body{padding:0 14px 14px;border-top:1px solid var(--border);}
  .sec-desc{font-size:11.5px;color:var(--sub);margin:10px 0;line-height:1.45;}
  .sub-h{font-size:12px;font-weight:800;color:var(--gold);margin:14px 0 6px;}

  .grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .cell{min-width:0;}
  .cell label{display:block;font-size:10.5px;color:var(--sub);margin-bottom:3px;}
  .cell input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 6px;border-radius:7px;font-size:15px;text-align:right;}
  .cell input:disabled{opacity:.6;}
  .cell .ro{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:8px 6px;font-size:13px;text-align:right;min-height:35px;overflow-wrap:anywhere;}
  .neg{color:var(--red);}
  .bad{color:var(--red);font-weight:800;}
  .statusPill{display:inline-block;font-size:9.5px;font-weight:800;border-radius:20px;padding:1px 7px;margin-left:5px;vertical-align:middle;}
  .statusPill.inasubiri{background:var(--gold-dim);color:var(--gold);}
  .statusPill.imekubaliwa{background:rgba(31,157,116,0.16);color:var(--green);}
  .statusPill.imekataliwa{background:rgba(226,100,90,0.16);color:var(--red);}
  .totalline{margin-top:9px;font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;background:var(--gold-dim);padding:8px 10px;border-radius:8px;}

  .agent-card{border:1px solid var(--border);border-radius:12px;padding:10px;margin-top:9px;background:var(--panel2);}
  .agent-card .ah{display:flex;justify-content:space-between;font-weight:700;font-size:12.5px;margin-bottom:8px;gap:8px;}
  .agent-card .code{color:var(--sub);font-weight:500;}
  input.note{width:100%;margin-top:8px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 9px;border-radius:7px;font-size:13px;}
  .checkline{margin-top:10px;}
  .checkline label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;}
  .checkline input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:8px;font-size:14px;}

  .sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .sumbox{background:var(--gold-dim);border-radius:10px;padding:9px 10px;}
  .sumbox .lbl{font-size:10.5px;color:var(--sub);}
  .sumbox .val{font-size:14px;font-weight:800;margin-top:2px;overflow-wrap:anywhere;}

  .btn{background:var(--gold);color:#231603;border:none;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer;}
  .btn.wide{width:100%;margin-top:12px;}
  .btn:disabled{opacity:.55;cursor:default;}
  .msg{font-size:12px;margin-top:8px;min-height:15px;}
  .msg.ok{color:var(--green);} .msg.err{color:var(--red);}
  .empty{font-size:12px;color:var(--sub);padding:10px 0;}

  .perm-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .perm-row:last-child{border-bottom:none;}
  .perm-row .who{min-width:0;} .perm-row .who small{display:block;color:var(--sub);font-size:11px;overflow-wrap:anywhere;}
  .perm-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);flex:none;}
  .howto{font-size:12px;color:var(--sub);line-height:1.6;margin:10px 0 0;padding-left:16px;}

  .savebar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--border);padding:10px 12px;display:none;align-items:center;gap:10px;z-index:20;}
  .savebar .status{flex:1;font-size:12px;color:var(--sub);min-width:0;}
  .savebar .status.err{color:var(--red);} .savebar .status.ok{color:var(--green);} .savebar .status.dirty{color:var(--gold);}
  .savebar .btn{flex:none;padding:11px 18px;}
</style>
</head>
<body>

<div class="auth-gate" id="authGate">
  <div class="auth-loading" id="authLoading">Inapakia...</div>
</div>

<div id="appContent" style="display:none">
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>COMBINE — Ofisi</h1>
      <div class="role" id="roleLabel"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <a href="portal.html" class="back-link">‹ Menu</a>
      <button class="icon-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn" aria-label="Badilisha mwonekano">🌙</button>
    </div>
  </div>

  <div class="datebar">
    <button onclick="shiftDate(-1)" aria-label="Siku iliyopita">‹</button>
    <input id="hDate" type="date" onchange="onDateChange()">
    <button onclick="shiftDate(1)" aria-label="Siku inayofuata">›</button>
    <button class="today" onclick="goToday()">Leo</button>
  </div>
  <div class="datelabel" id="dateLabel"></div>

  <div class="banner" id="banner"></div>

  <div class="kpis">
    <div class="kpi"><div class="lbl">Mpaka Asubuhi</div><div class="val" id="k-mpaka">0</div></div>
    <div class="kpi"><div class="lbl">Ilio Ingia</div><div class="val" id="k-in">0</div></div>
    <div class="kpi"><div class="lbl">Ilio Toka</div><div class="val" id="k-out">0</div></div>
    <div class="kpi"><div class="lbl">Combine Usiku</div><div class="val" id="k-cf">0</div></div>
    <div class="kpi"><div class="lbl">Pesa Usiku</div><div class="val" id="k-usiku">0</div></div>
    <div class="kpi"><div class="lbl">Miss ya Usiku</div><div class="val" id="k-m4">0</div></div>
  </div>

  <div id="sections"></div>
  <div id="permPanel"></div>
</div>

<div class="savebar" id="savebar">
  <div class="status" id="saveStatus">Hakuna mabadiliko.</div>
  <button class="btn" id="saveBtn" onclick="saveDay()">Hifadhi siku</button>
</div>
</div>

<script>
const SUPABASE_URL = "https://euhteovuhdvefzaavlqx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1aHRlb3Z1aGR2ZWZ6YWF2bHF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjQwNjEsImV4cCI6MjA5NzE0MDA2MX0.gaV1mShFhVHVpxAqCptJsiSr4r-d3_OYvdtH0bpR58Q";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DENOMS = [10000,5000,2000,1000,500,200,100,50];
const CATS = ['Combine 1','Combine 2','Combine 3','Combine THL','Combine *','Office','Others','Posho','MD'];
const COUNT_SECS = ['mwanzoni','ongezeko1','asubuhi','mchana','ongezeko2','ada','adjust_plus','adjust_minus','usiku'];
const AGENT_SECS = ['miamala','marejesho','chenji'];

let ROLE = null;                 // 'super' (Admin Mkuu) | 'editor' (amepewa ruhusa)
let AGENTS = [];
let START = zero();
let START_META = { exists:false, set_date:null };
let START_DIRTY = false;
let PREV = { counts: zero(), source:'none', date:null };
let DAY = null;
let CUR_DATE = '';
let STAMP = null;                // alama ya mwisho ya kuhifadhi siku hii (kugundua mtu mwingine kabadilisha)
let DIRTY = false;
let LOADED_KEYS = new Set();     // safu zilizopo tayari kwenye database
let LOADING = false;

/* ---------- helpers ---------- */
function zero(){ const o={}; DENOMS.forEach(d=>o[d]=0); return o; }
function $(id){ return document.getElementById(id); }
const fmt = n => (Number(n)||0).toLocaleString('en-US');
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sumD(o){ return DENOMS.reduce((s,d)=>s+d*(o[d]||0),0); }
function rowToCounts(r){ const o=zero(); DENOMS.forEach(d=>o[d]=r['d'+d]||0); return o; }
function cols(c){ const o={}; DENOMS.forEach(d=>o['d'+d]=c[d]||0); return o; }
function isBlank(c){ return DENOMS.every(d=>!(c[d]||0)); }
function clampNum(v){ return Math.min(99999999, Math.max(0, parseInt(v,10)||0)); }
function emptyDay(){
  const counts={}; COUNT_SECS.forEach(s=>counts[s]=zero());
  const agent={}; AGENT_SECS.forEach(s=>{ agent[s]={}; AGENTS.forEach(a=>agent[s][a.code]={counts:zero(),note:''}); });
  const mat={}; CATS.forEach(c=>mat[c]={counts:zero(),note:'',status:null});
  return {counts,agent,mat};
}
function todayStr(){ return new Date().toLocaleDateString('sv-SE'); }

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  $('themeToggleBtn').textContent = theme==='light' ? '☀️' : '🌙';
  localStorage.setItem('hekima_theme', theme);
}
function toggleTheme(){ applyTheme((localStorage.getItem('hekima_theme')||'light')==='light'?'dark':'light'); }

function showBanner(text, info){
  const b=$('banner'); if(!text){ b.style.display='none'; return; }
  b.className='banner'+(info?' info':''); b.textContent=text; b.style.display='block';
}
function setStatus(text, cls){ const s=$('saveStatus'); s.textContent=text; s.className='status'+(cls?' '+cls:''); }
function markDirty(){ DIRTY=true; setStatus('Una mabadiliko ambayo hujahifadhi.','dirty'); }

/* ---------- html builders ---------- */
function inputGrid(attrs){
  return `<div class="grid8">${DENOMS.map(d=>`<div class="cell"><label>${fmt(d)}</label><input type="number" inputmode="numeric" min="0" step="1" placeholder="0" ${attrs} data-d="${d}"></div>`).join('')}</div>`;
}
function outGrid(key){
  return `<div class="grid8">${DENOMS.map(d=>`<div class="cell"><label>${fmt(d)}</label><div class="ro" id="o-${key}-${d}">0</div></div>`).join('')}</div>`;
}
function totalLine(label,id){ return `<div class="totalline"><span>${label}</span><span id="${id}">0</span></div>`; }
function sumR(id){ return `<span class="badge" id="b-${id}"></span><span class="sv" id="s-${id}">0</span>`; }
function sec(id,title,body){
  return `<details class="sec" id="sec-${id}"><summary><span class="st">${title}</span><span class="sr">${sumR(id)}</span></summary><div class="sec-body">${body}</div></details>`;
}
function agentBlocks(section){
  if(!AGENTS.length) return '<div class="empty">Hakuna wakala waliosajiliwa bado.</div>';
  return AGENTS.map(a=>`<div class="agent-card">
    <div class="ah"><span>${esc(a.name)} <span class="code">(${esc(a.code)})</span></span><span id="ag-${section}-${esc(a.code)}">0</span></div>
    ${inputGrid(`data-kind="agent" data-sec="${section}" data-agent="${esc(a.code)}"`)}
    <input class="note" type="text" placeholder="Maelezo (hiari)" data-kind="agentnote" data-sec="${section}" data-agent="${esc(a.code)}">
  </div>`).join('');
}
function matBlocks(){
  return CATS.map(c=>`<div class="agent-card">
    <div class="ah"><span>${esc(c)} <span id="ms-${esc(c)}"></span></span><span id="mt-${esc(c)}">0</span></div>
    ${inputGrid(`data-kind="mat" data-cat="${esc(c)}"`)}
    <input class="note" type="text" placeholder="Maelezo (hiari)" data-kind="matnote" data-cat="${esc(c)}">
  </div>`).join('');
}
function matStatusLabel(s){
  if(s==='imekubaliwa') return '<span class="statusPill imekubaliwa">Imekubaliwa</span>';
  if(s==='imekataliwa') return '<span class="statusPill imekataliwa">Imekataliwa</span>';
  if(s==='inasubiri') return '<span class="statusPill inasubiri">Inasubiri</span>';
  return '';
}

function renderSections(){
  const H=[];
  H.push(sec('start','START — Mtaji wa kuanzia',
    `<p class="sec-desc">Idadi ya noti za kuanzia. Huwekwa mara moja tu mwanzoni mwa project na Admin Mkuu pekee. Siku ya kwanza ya Combine huanza na hesabu hii.</p>
     ${inputGrid('data-kind="start"')}
     ${totalLine('JUMLA','t-start')}
     <div class="checkline"><label>Tarehe ya kuanza (hiari)</label><input type="date" data-kind="startdate"></div>
     ${ROLE==='super'
        ? `<button class="btn wide" id="saveStartBtn" onclick="saveStart()">Hifadhi START</button>`
        : `<p class="sec-desc">Unaweza kuiona tu. Admin Mkuu ndiye anayeweza kuibadilisha.</p>`}
     <div class="msg" id="msg-start"></div>`));

  H.push(sec('mpaka','1 · MPAKA ASUBUHI',
    `<p class="sec-desc" id="mpakaSource"></p>
     ${outGrid('mpaka')}
     ${totalLine('JUMLA','t-mpaka')}`));

  H.push(sec('mwanzoni','2 · PESA MWANZONI',
    `<p class="sec-desc">Hesabu ya noti ulizoanza nazo asubuhi.</p>
     ${inputGrid('data-kind="count" data-sec="mwanzoni"')}
     ${totalLine('JUMLA','t-mwanzoni')}
     <div class="sub-h">MISS (Mpaka Asubuhi − Pesa Mwanzoni)</div>
     ${outGrid('m1')}
     ${totalLine('JUMLA MISS','t-m1')}`));

  H.push(sec('ongezeko1','3 · ONGEZEKO (Asubuhi)',
    `<p class="sec-desc">Fedha zilizoongezwa kwenye Combine asubuhi.</p>
     ${inputGrid('data-kind="count" data-sec="ongezeko1"')}
     ${totalLine('JUMLA','t-ongezeko1')}`));

  H.push(sec('miamala','4 · MIAMALA',
    `<p class="sec-desc">Hela inayotoka ofisini kwenda kwa wateja (mikopo mipya) — inapunguza Combine. Andika noti kwa kila wakala.</p>
     ${agentBlocks('miamala')}
     <div class="sub-h">Jumla ya kila noti</div>
     ${outGrid('y')}
     ${totalLine('JUMLA MIAMALA','t-y')}`));

  H.push(sec('matumizi','5 · MATUMIZI ASUBUHI',
    `<p class="sec-desc">Matumizi madogo madogo kwa kila aina, kwa idadi ya noti.</p>
     ${matBlocks()}
     <div class="sub-h">Jumla ya kila noti</div>
     ${outGrid('ak')}
     ${totalLine('JUMLA MATUMIZI','t-ak')}`));

  H.push(sec('asubuhi','6 · PESA ASUBUHI',
    `<div class="sub-h" style="margin-top:10px">Inatarajiwa (Baada ya Asubuhi)</div>
     <p class="sec-desc" style="margin:0 0 8px">Pesa Mwanzoni + Ongezeko − Miamala − Matumizi</p>
     ${outGrid('aq')}
     ${totalLine('JUMLA INATARAJIWA','t-aq')}
     <div class="sub-h">Uliyohesabu (Pesa Asubuhi)</div>
     ${inputGrid('data-kind="count" data-sec="asubuhi"')}
     ${totalLine('JUMLA','t-asubuhi')}
     <div class="sub-h">MISS (Inatarajiwa − Uliyohesabu)</div>
     ${outGrid('m2')}
     ${totalLine('JUMLA MISS','t-m2')}`));

  H.push(sec('mchana','7 · PESA MCHANA',
    `<p class="sec-desc">Hesabu ya noti mchana.</p>
     ${inputGrid('data-kind="count" data-sec="mchana"')}
     ${totalLine('JUMLA','t-mchana')}
     <div class="sub-h">MISS ya Mchana (Pesa Asubuhi − Pesa Mchana)</div>
     ${outGrid('m3')}
     ${totalLine('JUMLA MISS','t-m3')}`));

  H.push(sec('ongezeko2','8 · ONGEZEKO (Mchana)',
    `<p class="sec-desc">Fedha zilizoongezwa kwenye Combine mchana.</p>
     ${inputGrid('data-kind="count" data-sec="ongezeko2"')}
     ${totalLine('JUMLA','t-ongezeko2')}`));

  H.push(sec('marejesho','9 · MAREJESHO',
    `<p class="sec-desc">Marejesho ya wateja kwa siku husika. Andika noti kwa kila wakala.</p>
     ${agentBlocks('marejesho')}
     <div class="sub-h">Jumla ya kila noti</div>
     ${outGrid('bq')}
     ${totalLine('JUMLA MAREJESHO','t-bq')}`));

  H.push(sec('ada','9b · ADA / KAMISHENI',
    `<p class="sec-desc">Mapato ya ada au kamisheni yaliyopokelewa leo (siyo marejesho ya mkopo). Inaongeza fedha taslimu ya Combine.</p>
     ${inputGrid('data-kind="count" data-sec="ada"')}
     ${totalLine('JUMLA','t-ada')}`));

  H.push(sec('chenji','10 · CHENJI',
    `<p class="sec-desc">Chenji kwa kila wakala.</p>
     ${agentBlocks('chenji')}
     <div class="sub-h">Jumla ya kila noti</div>
     ${outGrid('cc')}
     ${totalLine('JUMLA CHENJI','t-cc')}`));

  H.push(sec('adjust','11 · ADJUST',
    `<p class="sec-desc">Marekebisho ya mwisho wa siku: noti zinazoongezwa au kupunguzwa.</p>
     <div class="sub-h" style="margin-top:0">Ongeza (+)</div>
     ${inputGrid('data-kind="count" data-sec="adjust_plus"')}
     ${totalLine('JUMLA +','t-adjp')}
     <div class="sub-h">Punguza (−)</div>
     ${inputGrid('data-kind="count" data-sec="adjust_minus"')}
     ${totalLine('JUMLA −','t-adjm')}`));

  H.push(sec('usiku','12 · PESA USIKU',
    `<div class="sub-h" style="margin-top:10px">Inatarajiwa (Combine Usiku)</div>
     <p class="sec-desc" style="margin:0 0 8px">Pesa Mchana + Ongezeko (Mchana) + Marejesho + Chenji + Adjust</p>
     ${outGrid('cf')}
     ${totalLine('COMBINE USIKU','t-cf')}
     <div class="sub-h">Uliyohesabu (Pesa Usiku)</div>
     ${inputGrid('data-kind="count" data-sec="usiku"')}
     ${totalLine('JUMLA','t-usiku')}
     <div class="sub-h">MISS ya Usiku (Combine Usiku − Pesa Usiku)</div>
     ${outGrid('m4')}
     ${totalLine('JUMLA MISS','t-m4')}
     <p class="sec-desc">Pesa Usiku unayohifadhi hapa ndiyo itakuwa Mpaka Asubuhi ya siku inayofuata.</p>`));

  H.push(`<details class="sec" id="sec-muhtasari"><summary><span class="st">13 · MUHTASARI WA SIKU</span><span class="sr"></span></summary><div class="sec-body">
     <div class="sumgrid">
       <div class="sumbox"><div class="lbl">PESA ILIO TOKA (Matumizi)</div><div class="val" id="x-toka">0</div></div>
       <div class="sumbox"><div class="lbl">PESA ILIO INGIA (Ongezeko)</div><div class="val" id="x-ingia">0</div></div>
       <div class="sumbox"><div class="lbl">MIAMALA</div><div class="val" id="x-miamala">0</div></div>
       <div class="sumbox"><div class="lbl">MAREJESHO</div><div class="val" id="x-marejesho">0</div></div>
       <div class="sumbox"><div class="lbl">CHENJI</div><div class="val" id="x-chenji">0</div></div>
       <div class="sumbox"><div class="lbl">ADJUST (+ −)</div><div class="val" id="x-adjust">0</div></div>
     </div>
   </div></details>`);

  $('sections').innerHTML = H.join('');
}

/* ---------- calculations (zinafuata Excel COMBINE_TEMPLET) ---------- */
function compute(){
  const C=DAY.counts;
  const M={Y:{},AK:{},BQ:{},CC:{},AQ:{},m1:{},m2:{},m3:{},CF:{},m4:{}};
  DENOMS.forEach(d=>{
    M.Y[d]  = AGENTS.reduce((s,a)=>s+DAY.agent.miamala[a.code].counts[d],0);
    M.BQ[d] = AGENTS.reduce((s,a)=>s+DAY.agent.marejesho[a.code].counts[d],0);
    M.CC[d] = AGENTS.reduce((s,a)=>s+DAY.agent.chenji[a.code].counts[d],0);
    M.AK[d] = CATS.reduce((s,c)=>s+DAY.mat[c].counts[d],0);
    M.m1[d] = PREV.counts[d] - C.mwanzoni[d];
    M.AQ[d] = C.mwanzoni[d] + C.ongezeko1[d] - M.Y[d] - M.AK[d];
    M.m2[d] = M.AQ[d] - C.asubuhi[d];
    M.m3[d] = C.asubuhi[d] - C.mchana[d];
    M.CF[d] = C.mchana[d] + C.ongezeko2[d] + M.BQ[d] + M.CC[d] + C.ada[d] + C.adjust_plus[d] - C.adjust_minus[d];
    M.m4[d] = M.CF[d] - C.usiku[d];
  });
  return M;
}
function setOut(key, arr, isMiss){
  DENOMS.forEach(d=>{
    const el=$(`o-${key}-${d}`); if(!el) return;
    const v=arr[d]||0;
    el.textContent=fmt(v);
    el.className='ro'+(isMiss ? (v!==0?' bad':'') : (v<0?' neg':''));
  });
}
function setT(id,val,isMiss){
  const el=$(id); if(!el) return;
  el.textContent=fmt(val);
  el.className=(isMiss && val!==0) || val<0 ? 'bad' : '';
}
function setBadge(id,val){
  const b=$('b-'+id); if(!b) return;
  if(val!==0){ b.textContent='Miss '+fmt(val); b.style.display='inline-block'; } else { b.style.display='none'; }
}
function recalc(){
  if(!DAY) return;
  const C=DAY.counts, M=compute();
  setOut('mpaka',PREV.counts); setOut('m1',M.m1,true); setOut('y',M.Y); setOut('ak',M.AK);
  setOut('aq',M.AQ); setOut('m2',M.m2,true); setOut('m3',M.m3,true);
  setOut('bq',M.BQ); setOut('cc',M.CC); setOut('cf',M.CF); setOut('m4',M.m4,true);

  const T={
    start:sumD(START), mpaka:sumD(PREV.counts), mwanzoni:sumD(C.mwanzoni), m1:sumD(M.m1),
    ongezeko1:sumD(C.ongezeko1), y:sumD(M.Y), ak:sumD(M.AK), aq:sumD(M.AQ), asubuhi:sumD(C.asubuhi), m2:sumD(M.m2),
    mchana:sumD(C.mchana), m3:sumD(M.m3), ongezeko2:sumD(C.ongezeko2), ada:sumD(C.ada), bq:sumD(M.BQ), cc:sumD(M.CC),
    adjp:sumD(C.adjust_plus), adjm:sumD(C.adjust_minus), cf:sumD(M.CF), usiku:sumD(C.usiku), m4:sumD(M.m4)
  };
  setT('t-start',T.start); setT('t-mpaka',T.mpaka); setT('t-mwanzoni',T.mwanzoni); setT('t-m1',T.m1,true);
  setT('t-ongezeko1',T.ongezeko1); setT('t-y',T.y); setT('t-ak',T.ak); setT('t-aq',T.aq); setT('t-asubuhi',T.asubuhi);
  setT('t-m2',T.m2,true); setT('t-mchana',T.mchana); setT('t-m3',T.m3,true); setT('t-ongezeko2',T.ongezeko2); setT('t-ada',T.ada);
  setT('t-bq',T.bq); setT('t-cc',T.cc); setT('t-adjp',T.adjp); setT('t-adjm',T.adjm);
  setT('t-cf',T.cf); setT('t-usiku',T.usiku); setT('t-m4',T.m4,true);

  const S={start:T.start,mpaka:T.mpaka,mwanzoni:T.mwanzoni,ongezeko1:T.ongezeko1,miamala:T.y,matumizi:T.ak,asubuhi:T.asubuhi,
           mchana:T.mchana,ongezeko2:T.ongezeko2,marejesho:T.bq,chenji:T.cc,usiku:T.usiku};
  Object.keys(S).forEach(k=>{ const el=$('s-'+k); if(el) el.textContent=fmt(S[k]); });
  const adjNet=T.adjp-T.adjm;
  const sa=$('s-adjust'); if(sa) sa.textContent=(adjNet>0?'+':'')+fmt(adjNet);
  setBadge('mwanzoni',T.m1); setBadge('asubuhi',T.m2); setBadge('mchana',T.m3); setBadge('usiku',T.m4);

  AGENT_SECS.forEach(s=>AGENTS.forEach(a=>{
    const el=$(`ag-${s}-${a.code}`); if(el) el.textContent=fmt(sumD(DAY.agent[s][a.code].counts));
  }));
  CATS.forEach(c=>{
    const el=$('mt-'+c); if(el) el.textContent=fmt(sumD(DAY.mat[c].counts));
    const se=$('ms-'+c); if(se){ const st=DAY.mat[c].status; se.innerHTML = (st && !isBlank(DAY.mat[c].counts)) ? matStatusLabel(st) : ''; }
  });

  const ingia=T.ongezeko1+T.ongezeko2+T.ada;
  const put=(id,v,bad)=>{ const el=$(id); if(el){ el.textContent=fmt(v); el.className='val'+(bad&&v!==0?' bad':''); } };
  put('k-mpaka',T.mpaka); put('k-in',ingia); put('k-out',T.ak); put('k-cf',T.cf); put('k-usiku',T.usiku); put('k-m4',T.m4,true);
  put('x-toka',T.ak); put('x-ingia',ingia); put('x-miamala',T.y); put('x-marejesho',T.bq); put('x-chenji',T.cc);
  const xa=$('x-adjust'); if(xa) xa.textContent='+'+fmt(T.adjp)+'  −'+fmt(T.adjm);

  const src=$('mpakaSource');
  if(src){
    src.textContent = PREV.source==='prev' ? `Imetoka kwenye Pesa Usiku ya tarehe ${PREV.date}.`
      : PREV.source==='start' ? 'Hakuna siku ya nyuma iliyohifadhiwa — imetoka kwenye START.'
      : 'START bado haijawekwa. Admin Mkuu aiweke kwanza.';
  }
}

/* ---------- inputs ---------- */
function fillInputs(){
  document.querySelectorAll('#sections [data-kind]').forEach(el=>{
    const k=el.dataset.kind, d=el.dataset.d;
    if(k==='startdate'){ el.value=START_META.set_date||''; el.disabled=ROLE!=='super'; return; }
    if(k==='agentnote'){ el.value=DAY.agent[el.dataset.sec][el.dataset.agent].note||''; return; }
    if(k==='matnote'){ el.value=DAY.mat[el.dataset.cat].note||''; return; }
    let v=0;
    if(k==='count') v=DAY.counts[el.dataset.sec][d];
    else if(k==='agent') v=DAY.agent[el.dataset.sec][el.dataset.agent].counts[d];
    else if(k==='mat') v=DAY.mat[el.dataset.cat].counts[d];
    else if(k==='start'){ v=START[d]; el.disabled=ROLE!=='super'; }
    el.value = v ? v : '';
  });
}
document.addEventListener('input', e=>{
  const el=e.target, k=el.dataset && el.dataset.kind; if(!k || !DAY) return;
  const d=el.dataset.d;
  if(k==='startdate'){ START_META.set_date=el.value||null; START_DIRTY=true; return; }
  if(k==='agentnote'){ DAY.agent[el.dataset.sec][el.dataset.agent].note=el.value; markDirty(); return; }
  if(k==='matnote'){ DAY.mat[el.dataset.cat].note=el.value; markDirty(); return; }
  const val=clampNum(el.value);
  if(k==='start'){ START[d]=val; START_DIRTY=true; const m=$('msg-start'); if(m){ m.textContent='START ina mabadiliko ambayo hujahifadhi.'; m.className='msg'; } recalc(); return; }
  if(k==='count') DAY.counts[el.dataset.sec][d]=val;
  else if(k==='agent') DAY.agent[el.dataset.sec][el.dataset.agent].counts[d]=val;
  else if(k==='mat') DAY.mat[el.dataset.cat].counts[d]=val;
  markDirty(); recalc();
});
document.addEventListener('change', e=>{
  const el=e.target, k=el.dataset && el.dataset.kind;
  if(!k || k.endsWith('note') || k==='startdate') return;
  el.value = clampNum(el.value) || '';
});
window.addEventListener('beforeunload', e=>{ if(DIRTY || START_DIRTY){ e.preventDefault(); e.returnValue=''; } });

/* ---------- dates ---------- */
function updateDateLabel(){
  const v=$('hDate').value; if(!v){ $('dateLabel').textContent=''; return; }
  let t=v;
  try{ t=new Date(v+'T00:00:00').toLocaleDateString('sw-TZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }catch(e){}
  $('dateLabel').textContent=t;
}
function shiftDate(n){
  const v=$('hDate').value||todayStr();
  const dt=new Date(v+'T00:00:00'); dt.setDate(dt.getDate()+n);
  $('hDate').value=dt.toLocaleDateString('sv-SE');
  onDateChange();
}
function goToday(){ $('hDate').value=todayStr(); onDateChange(); }
function onDateChange(){
  const nd=$('hDate').value;
  if(!nd){ $('hDate').value=CUR_DATE; return; }
  if(nd===CUR_DATE) return;
  if(DIRTY && !confirm('Una mabadiliko ambayo hujahifadhi. Ukibadilisha tarehe yatapotea. Endelea?')){ $('hDate').value=CUR_DATE; return; }
  loadDay();
}

/* ---------- load ---------- */
function stampFrom(rowsList){
  let max=null;
  rowsList.forEach(rows=>(rows||[]).forEach(r=>{ if(r.updated_at && (!max || r.updated_at>max)) max=r.updated_at; }));
  return max;
}
async function loadDay(){
  const date=$('hDate').value; if(!date || LOADING) return;
  LOADING=true; showBanner('');
  setStatus('Inapakia...');
  const [cR,aR,mR,pR,sR]=await Promise.all([
    sb.from('combine_counts').select('*').eq('work_date',date),
    sb.from('combine_agent_entries').select('*').eq('work_date',date),
    sb.from('combine_matumizi').select('*').eq('work_date',date),
    sb.from('combine_counts').select('*').eq('section','usiku').lt('work_date',date).order('work_date',{ascending:false}).limit(1),
    sb.from('combine_start').select('*').eq('id','singleton').maybeSingle()
  ]);
  const err=cR.error||aR.error||mR.error||pR.error||sR.error;
  if(err){
    LOADING=false;
    $('hDate').value=CUR_DATE||date;
    showBanner('Imeshindwa kupakia data ya '+date+': '+err.message+'. Data uliyokuwa nayo haijaguswa.');
    setStatus('Imeshindwa kupakia.','err');
    return;
  }
  DAY=emptyDay(); LOADED_KEYS=new Set();
  (cR.data||[]).forEach(r=>{ if(DAY.counts[r.section]){ DAY.counts[r.section]=rowToCounts(r); LOADED_KEYS.add('c:'+r.section); } });
  (aR.data||[]).forEach(r=>{
    const t=DAY.agent[r.section] && DAY.agent[r.section][r.agent_code];
    if(t){ t.counts=rowToCounts(r); t.note=r.note||''; LOADED_KEYS.add('a:'+r.section+':'+r.agent_code); }
  });
  (mR.data||[]).forEach(r=>{ const t=DAY.mat[r.category]; if(t){ t.counts=rowToCounts(r); t.note=r.note||''; t.status=r.status||'inasubiri'; LOADED_KEYS.add('m:'+r.category); } });

  START = sR.data ? rowToCounts(sR.data) : zero();
  START_META = { exists: !!sR.data, set_date: sR.data ? sR.data.set_date : null };
  START_DIRTY=false;
  const p=(pR.data||[])[0];
  if(p) PREV={counts:rowToCounts(p),source:'prev',date:p.work_date};
  else PREV={counts:START,source:START_META.exists?'start':'none',date:null};

  STAMP=stampFrom([cR.data,aR.data,mR.data]);
  CUR_DATE=date; DIRTY=false; LOADING=false;
  updateDateLabel(); fillInputs(); recalc();
  if(!START_META.exists) showBanner('START bado haijawekwa. '+(ROLE==='super'?'Fungua sehemu ya START uweke mtaji wa kuanzia.':'Admin Mkuu aiweke kwanza.'),true);
  setStatus('Hakuna mabadiliko.');
}

/* ---------- save ---------- */
async function fetchStamp(date){
  const q=t=>sb.from(t).select('updated_at').eq('work_date',date).order('updated_at',{ascending:false}).limit(1);
  const [a,b,c]=await Promise.all([q('combine_counts'),q('combine_agent_entries'),q('combine_matumizi')]);
  const err=a.error||b.error||c.error;
  return { error:err, stamp: err?null:stampFrom([a.data,b.data,c.data]) };
}
async function saveDay(){
  if(!ROLE || !CUR_DATE || !DAY) return;
  const date=CUR_DATE, btn=$('saveBtn');
  btn.disabled=true; setStatus('Inahifadhi...');
  const cur=await fetchStamp(date);
  if(cur.error){ setStatus('Imeshindwa kuhifadhi: '+cur.error.message,'err'); btn.disabled=false; return; }
  if(cur.stamp!==STAMP && !confirm('Mtu mwingine ameshahifadhi mabadiliko ya siku hii tangu uliipofungua. Ukiendelea utaandika juu ya alichohifadhi. Endelea?')){
    setStatus('Haikuhifadhiwa. Pakia siku upya ili uone mabadiliko ya mwenzako.','err'); btn.disabled=false; return;
  }

  const cRows=[], aRows=[], mRows=[], newKeys=[];
  COUNT_SECS.forEach(s=>{
    const c=DAY.counts[s];
    if(LOADED_KEYS.has('c:'+s) || !isBlank(c)){ cRows.push({work_date:date,section:s,...cols(c)}); newKeys.push('c:'+s); }
  });
  AGENT_SECS.forEach(s=>AGENTS.forEach(a=>{
    const e=DAY.agent[s][a.code], key='a:'+s+':'+a.code;
    if(LOADED_KEYS.has(key) || !isBlank(e.counts) || (e.note||'').trim()){
      aRows.push({work_date:date,section:s,agent_code:a.code,...cols(e.counts),note:(e.note||'').trim()||null}); newKeys.push(key);
    }
  }));
  CATS.forEach(c=>{
    const e=DAY.mat[c], key='m:'+c;
    if(LOADED_KEYS.has(key) || !isBlank(e.counts) || (e.note||'').trim()){
      mRows.push({work_date:date,category:c,...cols(e.counts),note:(e.note||'').trim()||null}); newKeys.push(key);
    }
  });

  const failed=[];
  if(cRows.length){ const r=await sb.from('combine_counts').upsert(cRows,{onConflict:'work_date,section'}); if(r.error) failed.push('Hesabu za noti: '+r.error.message); }
  if(aRows.length){ const r=await sb.from('combine_agent_entries').upsert(aRows,{onConflict:'work_date,section,agent_code'}); if(r.error) failed.push('Miamala/Marejesho/Chenji: '+r.error.message); }
  if(mRows.length){ const r=await sb.from('combine_matumizi').upsert(mRows,{onConflict:'work_date,category'}); if(r.error) failed.push('Matumizi: '+r.error.message); }

  btn.disabled=false;
  if(failed.length){
    setStatus('Sehemu nyingine hazikuhifadhiwa — bonyeza Hifadhi tena.','err');
    showBanner('Hitilafu wakati wa kuhifadhi: '+failed.join(' | ')+'. Data yako bado iko kwenye skrini; usifunge ukurasa.');
    return;
  }
  newKeys.forEach(k=>LOADED_KEYS.add(k));
  const after=await fetchStamp(date);
  if(!after.error) STAMP=after.stamp;
  DIRTY=false; showBanner('');
  setStatus('Imehifadhiwa ✓ '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),'ok');
}

async function saveStart(){
  if(ROLE!=='super') return;
  const msg=$('msg-start'), btn=$('saveStartBtn');
  if(START_META.exists && !confirm('START tayari imewekwa. Kuibadilisha kutabadilisha Mpaka Asubuhi ya siku ya kwanza na mahesabu yanayofuata. Endelea?')) return;
  btn.disabled=true; msg.textContent='Inahifadhi...'; msg.className='msg';
  const row={id:'singleton', set_date:START_META.set_date||null, ...cols(START)};
  const r=await sb.from('combine_start').upsert([row],{onConflict:'id'});
  btn.disabled=false;
  if(r.error){ msg.textContent='Imeshindwa: '+r.error.message; msg.className='msg err'; return; }
  START_META.exists=true; START_DIRTY=false;
  msg.textContent='START imehifadhiwa ✓'; msg.className='msg ok';
  showBanner('');
  // Mpaka Asubuhi ya siku ya kwanza inategemea START — hesabu upya
  const pR=await sb.from('combine_counts').select('work_date').eq('section','usiku').lt('work_date',CUR_DATE).limit(1);
  if(!pR.error && !(pR.data||[]).length){ PREV={counts:START,source:'start',date:null}; }
  recalc();
}

/* ---------- ruhusa (Admin Mkuu tu) ---------- */
function renderPermShell(){
  if(ROLE!=='super'){ $('permPanel').innerHTML=''; return; }
  $('permPanel').innerHTML=`<details class="sec" id="sec-perm"><summary><span class="st">Ruhusa za Combine</span><span class="sr"></span></summary><div class="sec-body">
    <p class="sec-desc">Wewe ndiye Admin Mkuu, kwa hiyo una ruhusa yote. Ukimpa mtu ruhusa hapa, ataona na kuweza kuhariri Combine ya kila siku (bila START na bila kuongeza watu). Asiyepewa ruhusa haoni chochote — hata menyu ya Combine haimtokei.</p>
    <div id="permList"><div class="empty">Inapakia...</div></div>
    <div class="msg" id="msg-perm"></div>
  </div></details>`;
  loadPerms();
}
async function loadPerms(){
  const [pr,ac]=await Promise.all([
    sb.from('mikopo_profiles').select('id,full_name,email,role,admin_level,active').eq('active',true).neq('role','agent').order('full_name'),
    sb.from('combine_access').select('user_id')
  ]);
  const box=$('permList');
  if(pr.error||ac.error){ box.innerHTML='<div class="empty">Imeshindwa kupakia orodha: '+esc((pr.error||ac.error).message)+'</div>'; return; }
  const granted=new Set((ac.data||[]).map(r=>r.user_id));
  const people=(pr.data||[]).filter(p=>p.admin_level!=='super');
  if(!people.length){
    box.innerHTML='<div class="empty">Hakuna wafanyakazi wengine (wasio wakala) waliosajiliwa bado. Sajili akaunti yao kwanza, kisha urudi hapa kuwapa ruhusa.</div>';
    return;
  }
  box.innerHTML=people.map(p=>`<div class="perm-row">
    <div class="who">${esc(p.full_name||p.email||'Bila jina')}<small>${esc(p.email||'')} · ${esc(p.role)}</small></div>
    <input type="checkbox" aria-label="Ruhusa ya Combine kwa ${esc(p.full_name||p.email||'mfanyakazi')}" ${granted.has(p.id)?'checked':''} onchange="toggleAccess('${esc(p.id)}',this)">
  </div>`).join('');
}
async function toggleAccess(id,box){
  const on=box.checked, msg=$('msg-perm');
  if(!on && !confirm('Kumwondolea mtu huyu ruhusa ya Combine? Hataona tena Combine.')){ box.checked=true; return; }
  box.disabled=true;
  const r = on ? await sb.from('combine_access').upsert([{user_id:id}],{onConflict:'user_id'})
               : await sb.from('combine_access').delete().eq('user_id',id);
  box.disabled=false;
  if(r.error){ box.checked=!on; msg.textContent='Imeshindwa: '+r.error.message; msg.className='msg err'; return; }
  msg.textContent = on ? 'Ruhusa imetolewa ✓' : 'Ruhusa imeondolewa ✓'; msg.className='msg ok';
}

/* ---------- start ---------- */
function gateMessage(text, retry){
  $('authLoading').innerHTML=esc(text)+(retry?'<br><button class="btn" onclick="location.reload()">Jaribu tena</button>':'');
}
async function init(){
  applyTheme(localStorage.getItem('hekima_theme')||'light');
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){ location.replace('portal.html'); return; }
    const {data:role,error}=await sb.rpc('combine_my_role');
    if(error){
      const missing=/combine_my_role|schema cache|function/i.test(error.message||'');
      gateMessage(missing ? 'Mfumo wa Combine bado haujawekwa kwenye database (faili la SQL halijaendeshwa).' : 'Imeshindwa kuunganisha. Angalia mtandao kisha jaribu tena.', true);
      return;
    }
    if(!role){ location.replace('portal.html'); return; }   // asiye na ruhusa haoni chochote
    ROLE=role;
    const ag=await sb.from('mikopo_agents').select('code,name').order('name');
    if(ag.error){ gateMessage('Imeshindwa kupakia orodha ya wakala. Jaribu tena.', true); return; }
    AGENTS=ag.data||[];
    DAY=emptyDay();
    $('roleLabel').textContent = ROLE==='super' ? 'Admin Mkuu' : 'Msimamizi wa Combine';
    $('authGate').style.display='none';
    $('appContent').style.display='block';
    $('savebar').style.display='flex';
    renderSections(); renderPermShell();
    $('hDate').value=todayStr();
    await loadDay();
  }catch(e){
    gateMessage('Hitilafu isiyotarajiwa: '+(e.message||e), true);
  }
}
init();
