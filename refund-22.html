<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hekima Finance — Refund</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0a1f36; --panel:#123152; --panel2:#0e2743; --border:#1f3f61;
    --cyan:#c89a3d; --cyan-dim:rgba(200,154,61,0.16);
    --green:#1f9d74; --red:#e2645a; --text:#eef2f6; --sub:#93a7ba;
  }
  html[data-theme="light"]{
    --bg:#f5f6f1; --panel:#ffffff; --panel2:#eceee6; --border:#dee1d7;
    --text:#12202f; --sub:#51606c;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:60px;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px;flex-wrap:wrap;}
  .topbar h1{font-size:17px;margin:0;font-weight:600;}
  .logout-link{font-size:11px;color:var(--sub);cursor:pointer;text-decoration:underline;margin-left:10px;}
  .icon-toggle-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;}

  .auth-gate{
    position:fixed;inset:0;
    background:radial-gradient(120% 90% at 12% 0%, rgba(31,157,116,0.32), transparent 55%),
      radial-gradient(120% 90% at 88% 100%, rgba(200,154,61,0.28), transparent 55%),
      linear-gradient(160deg,#0a1f36 0%, #123152 60%, #0a1f36 100%);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .auth-loading{color:#dbe3ea;font-size:13px;text-align:center;}
  .login-box{width:100%;max-width:380px;background:rgba(255,255,255,0.98);border:1px solid rgba(255,255,255,0.4);border-radius:26px;padding:32px 26px 26px;box-shadow:0 30px 70px rgba(0,0,0,0.35);}
  .login-greeting{font-size:13px;font-weight:600;color:#b9863a;margin-bottom:6px;}
  .login-box h2{margin:0 0 4px;font-size:26px;font-weight:800;color:#12202f;}
  .login-box p{margin:0 0 22px;font-size:13.5px;color:#5b6b80;}
  .login-label{display:block;font-size:12.5px;color:#51606c;font-weight:600;margin:0 0 6px;}
  .login-field{position:relative;margin-bottom:16px;}
  .login-field .fico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8a97a6;}
  .login-input{width:100%;background:#f5f6f4;border:1.5px solid #e1e4dd;color:#12202f;padding:13px 14px 13px 42px;border-radius:12px;font-size:15px;}
  .login-input:focus{outline:none;border-color:#c89a3d;background:#fff;}
  .pw-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#8a97a6;cursor:pointer;padding:7px;display:flex;}
  .login-btn{width:100%;background:#0a1f36;color:#fff;border:none;padding:15px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;}
  .login-btn:active{background:#123152;}
  .login-err{color:#c0392b;font-size:12.5px;margin-top:12px;min-height:14px;text-align:center;}
  .login-help{text-align:center;margin-top:16px;font-size:13px;}
  .login-help a{color:#123152;text-decoration:none;font-weight:600;}
  .login-foot{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,0.55);}

  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab{flex:1;text-align:center;background:var(--panel);border:1px solid var(--border);color:var(--sub);padding:10px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;}
  .tab.active{background:var(--cyan-dim);border-color:var(--cyan);color:var(--cyan);}

  .date-row{display:flex;gap:8px;margin-bottom:12px;}
  .date-input{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:11px 12px;border-radius:12px;font-size:14px;}
  .search{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:12px;font-size:14px;margin-bottom:12px;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .chip{flex-shrink:0;background:var(--panel);border:1px solid var(--border);color:var(--sub);padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--cyan-dim);border-color:var(--cyan);color:var(--cyan);}

  .total-bar{
    background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:16px;
    padding:16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;
  }
  .total-bar .l{font-size:12px;color:var(--sub);}
  .total-bar .v{font-size:22px;font-weight:800;color:var(--cyan);}
  .total-bar .sub{font-size:11px;color:var(--sub);margin-top:2px;}

  .r-card{background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
  .r-info{flex:1;min-width:0;}
  .r-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .r-sub{font-size:11px;color:var(--sub);margin-top:1px;}
  .r-input{
    width:110px;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;border-radius:9px;font-size:14px;text-align:right;flex-shrink:0;
  }
  .r-input.filled{border-color:var(--green);}

  /* Quick Fill spreadsheet-style grid */
  .table-wrap{border:1px solid var(--border);border-radius:14px;overflow:auto;background:var(--panel);max-height:60vh;}
  table.fast-table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap;}
  .fast-table thead th{background:var(--panel2);color:var(--sub);text-transform:uppercase;font-size:9.5px;letter-spacing:0.5px;padding:9px 8px;text-align:left;position:sticky;top:0;z-index:1;border-bottom:1px solid var(--border);}
  .fast-table thead th.num{text-align:right;}
  .fast-table tbody td{padding:7px 8px;border-top:1px solid var(--border);}
  .fast-table tbody tr:nth-child(even){background:rgba(255,255,255,0.02);}
  .fast-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .fast-table td.red{color:var(--red);font-weight:700;}
  .fast-table td.green{color:var(--green);font-weight:700;}
  .fast-table td.agent-badge{color:var(--cyan);font-weight:700;font-size:11px;}
  .fast-table .r-input{
    width:88px;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:6px 8px;border-radius:8px;font-size:13px;text-align:right;
  }
  .fast-table .r-input.filled{border-color:var(--green);color:var(--green);font-weight:700;}
  .agent-band-0{box-shadow:inset 3px 0 0 var(--cyan);}
  .agent-band-1{box-shadow:inset 3px 0 0 var(--green);}
  .agent-band-2{box-shadow:inset 3px 0 0 #fbbf24;}
  .agent-band-3{box-shadow:inset 3px 0 0 #a78bfa;}

  .save-bar{position:sticky;bottom:0;background:var(--bg);padding-top:10px;margin-top:6px;}
  .save-btn{
    width:100%;background:var(--cyan);color:#231603;border:none;padding:14px;
    border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;
  }
  .save-btn:disabled{opacity:0.5;}
  .save-msg{text-align:center;font-size:12.5px;margin-top:10px;min-height:16px;}
  .save-msg.ok{color:var(--green);} .save-msg.err{color:var(--red);}

  /* Find by Date */
  .find-result{background:var(--panel);border-radius:14px;padding:16px;margin-top:14px;}
  .find-name{font-size:15px;font-weight:700;}
  .find-sub{font-size:12px;color:var(--sub);margin-top:2px;}
  .find-amount-row{display:flex;gap:8px;margin-top:14px;}

  /* Mini calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-nav{background:var(--panel2);border:1px solid var(--border);color:var(--cyan);width:30px;height:30px;border-radius:8px;cursor:pointer;}
  .cal-title{font-size:13px;font-weight:700;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{font-size:10px;color:var(--sub);text-align:center;padding:4px 0;}
  .cal-day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;
    font-size:11.5px;background:var(--panel2);color:var(--sub);cursor:pointer;position:relative;
  }
  .cal-day.paid{background:rgba(31,157,116,0.18);color:var(--green);font-weight:700;}
  .cal-day.empty{background:none;cursor:default;}
  .cal-day.selected{outline:2px solid var(--cyan);}

  .state-msg{text-align:center;color:var(--sub);font-size:13px;padding:30px 0;}

  @media (min-width:768px){
    .wrap{max-width:960px;}
    .fast-table{font-size:13.5px;}
  }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }

  .cash-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:16px;}
  .cash-box h3{margin:0 0 3px;font-size:14px;color:var(--text);}
  .cash-box .desc{font-size:11.5px;color:var(--sub);margin-bottom:10px;}
  table.denomtbl{width:100%;max-width:280px;border-collapse:collapse;font-size:13px;}
  table.denomtbl th, table.denomtbl td{border:1px solid #9fb3c8;padding:6px 8px;text-align:center;}
  table.denomtbl th{background:#dce6f1;color:#1a2b3c;font-weight:800;width:45%;}
  table.denomtbl td{background:#fbfcfe;}
  table.denomtbl td input{width:100%;border:none;background:transparent;padding:5px 4px;font-size:13px;text-align:right;color:#12202f;}
  table.denomtbl td input:focus{outline:2px solid #c89a3d;background:#fff;}
  table.denomtbl tr.total-row th, table.denomtbl tr.total-row td{background:#eef3fa;font-weight:800;color:#12202f;}
  .cash-status{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:700;margin-left:8px;}
  .cash-status.pending{background:rgba(200,154,61,0.18);color:#c89a3d;}
  .cash-status.confirmed{background:rgba(31,157,116,0.18);color:#1f9d74;}
  .cash-status.incomplete{background:rgba(226,100,90,0.18);color:#e2645a;}
  .lock-banner{background:rgba(226,100,90,0.15);color:var(--red);border:1px solid rgba(226,100,90,0.4);border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:700;margin:10px 0;text-align:center;}
  input:disabled, button:disabled{opacity:.5;cursor:not-allowed;}
</style>
</head>
<body>

<div class="auth-gate" id="authGate">
  <div class="auth-loading" id="authLoading">Loading...</div>
  <div class="login-box" id="loginBox" style="display:none">
    <div class="login-greeting" id="loginGreeting">Habari</div>
    <h2>Ingia</h2>
    <p>Tumia akaunti yako ya Hekima Finance kuingia.</p>
    <label class="login-label" for="loginEmail">Barua pepe</label>
    <div class="login-field">
      <svg class="fico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7l9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg>
      <input class="login-input" id="loginEmail" type="email" placeholder="jina@hekimafinance.co.tz">
    </div>
    <label class="login-label" for="loginPass">Nywila</label>
    <div class="login-field">
      <svg class="fico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input class="login-input" id="loginPass" type="password" placeholder="••••••••">
      <button type="button" class="pw-eye" id="pwEyeBtn" onclick="togglePwVisibility()" aria-label="Onyesha nywila">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button class="login-btn" onclick="doLogin()">Ingia</button>
    <div class="login-err" id="loginErr"></div>
    <div class="login-help"><a href="mailto:stevenlamwel@gmail.com">Umesahau nywila? Wasiliana na msimamizi</a></div>
  </div>
  <div class="login-foot">Hekima Finance &middot; Iringa, Tanzania</div>
</div>

<div id="appContent" style="display:none">
<div class="wrap">
  <div class="topbar">
    <h1 data-i18n="rf_title">Refund — Daily Repayments</h1>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      <a href="portal.html" style="color:var(--cyan);text-decoration:none;font-size:13px;" data-i18n="t_menu">‹ Menu</a>
      <button class="icon-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn">🌙</button>
      <button class="icon-toggle-btn" onclick="toggleLang()" id="langToggleBtn">EN</button>
      <span class="logout-link" onclick="doLogout()" data-i18n="t_logout">Log Out</span>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabFast" onclick="switchTab('fast')" data-i18n="rf_quick_fill">⚡ Quick Fill</div>
    <div class="tab" id="tabFind" onclick="switchTab('find')" data-i18n="rf_find_by_date">🔎 Find by Date</div>
  </div>

  <div id="fastPane"></div>
  <div id="findPane" style="display:none"></div>
</div>
</div>

<script>
const SUPABASE_URL = "https://euhteovuhdvefzaavlqx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1aHRlb3Z1aGR2ZWZ6YWF2bHF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjQwNjEsImV4cCI6MjA5NzE0MDA2MX0.gaV1mShFhVHVpxAqCptJsiSr4r-d3_OYvdtH0bpR58Q";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let ME = null;

function tzs(n){ return Math.round(n||0).toLocaleString('en-US') + " TZS"; }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ---------------- THEME (dark/light) ---------------- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggleBtn').textContent = theme==='light' ? '☀️' : '🌙';
  localStorage.setItem('hekima_theme', theme);
}
function toggleTheme(){
  const cur = localStorage.getItem('hekima_theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}

/* ---------------- LANGUAGE (EN/SW) ---------------- */
const HK_TR = {
  en: {
    t_menu:"‹ Menu", t_logout:"Log Out",
    rf_title:"Refund — Daily Repayments", rf_quick_fill:"⚡ Quick Fill", rf_find_by_date:"🔎 Find by Date",
    rf_total_label:"Total Repayments —", rf_no_balance:"No clients with a balance due.", rf_save_all:"Save All",
    rf_no_amount:"No amount has been entered.", rf_saving:"Saving...", rf_search_ph:"Search client name...",
    rf_searching:"Searching...", rf_no_one:"No one found.", rf_no_phone:"No phone", rf_balance_due:"Balance Due",
    rf_save:"Save", rf_enter_valid:"Enter a valid amount.", rf_saved:"✓ Saved.", rf_loading:"Loading...",
    rf_no_active_loan:"No active loan.", rf_loan_no:"Loan",
    rf_col_no:"No", rf_col_name:"Name", rf_col_agent:"Agent", rf_col_id:"ID",
    rf_col_balance:"Balance", rf_col_paid:"Paid So Far", rf_col_amount:"Amount"
  },
  sw: {
    t_menu:"‹ Menyu", t_logout:"Toka",
    rf_title:"Marejesho — Malipo ya Kila Siku", rf_quick_fill:"⚡ Jaza Haraka", rf_find_by_date:"🔎 Tafuta kwa Tarehe",
    rf_total_label:"Jumla ya Marejesho —", rf_no_balance:"Hakuna mteja mwenye deni.", rf_save_all:"Hifadhi Yote",
    rf_no_amount:"Hakuna kiasi kilichowekwa.", rf_saving:"Inahifadhi...", rf_search_ph:"Tafuta jina la mteja...",
    rf_searching:"Inatafuta...", rf_no_one:"Hakuna aliyepatikana.", rf_no_phone:"Hana simu", rf_balance_due:"Deni Lililobaki",
    rf_save:"Hifadhi", rf_enter_valid:"Weka kiasi sahihi.", rf_saved:"✓ Imehifadhiwa.", rf_loading:"Inapakia...",
    rf_no_active_loan:"Hana mkopo hai.", rf_loan_no:"Mkopo",
    rf_col_no:"Na", rf_col_name:"Jina", rf_col_agent:"Wakala", rf_col_id:"ID",
    rf_col_balance:"Deni Baki", rf_col_paid:"Marejesho Jumla", rf_col_amount:"Kiasi"
  }
};
function t(key){ const lang = localStorage.getItem('hekima_lang') || 'en'; return (HK_TR[lang] && HK_TR[lang][key]) || HK_TR.en[key] || key; }
function applyLang(lang){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(HK_TR[lang] && HK_TR[lang][key]) el.textContent = HK_TR[lang][key];
  });
  document.getElementById('langToggleBtn').textContent = lang==='en' ? 'EN' : 'SW';
  localStorage.setItem('hekima_lang', lang);
}
function toggleLang(){
  const cur = localStorage.getItem('hekima_lang') || 'en';
  applyLang(cur === 'en' ? 'sw' : 'en');
  if(FAST_LOADED) loadFastRows();
  if(FIND_LOADED && findState.clientId) renderFindDetail();
}

// ================= TAB SWITCHING =================
function switchTab(tab){
  document.getElementById('tabFast').classList.toggle('active', tab==='fast');
  document.getElementById('tabFind').classList.toggle('active', tab==='find');
  document.getElementById('fastPane').style.display = tab==='fast' ? 'block' : 'none';
  document.getElementById('findPane').style.display = tab==='find' ? 'block' : 'none';
  if(tab==='fast' && !FAST_LOADED){ initFastPane(); }
  if(tab==='find' && !FIND_LOADED){ initFindPane(); }
}

// ================= QUICK FILL =================
let FAST_LOADED = false;
let fastState = { date: todayISO(), agentCode: null };
let AGENTS = [];
let FAST_ROWS = [];

function initFastPane(){
  FAST_LOADED = true;
  const isAdmin = ME && ME.role === 'admin';
  if(!isAdmin) fastState.agentCode = ME ? ME.agent_code : null;

  document.getElementById('fastPane').innerHTML = `
    <div class="date-row">
      <input type="date" class="date-input" id="fastDate" value="${fastState.date}" onchange="onFastDateChange()">
    </div>
    <div class="lock-banner" id="fastLockBanner" style="display:none;">🔒 Siku hii imefungwa kiotomatiki — Admin Mkuu pekee anaweza kuhariri.</div>
    ${isAdmin ? `<div class="chips" id="fastChips"></div>` : ''}
    <div class="total-bar">
      <div>
        <div class="l">${t('rf_total_label')} <span id="fastDateLabel"></span></div>
        <div class="sub" id="fastCountLabel"></div>
      </div>
      <div class="v" id="fastTotal">0 TZS</div>
    </div>
    <div id="fastRows"><div class="state-msg">${t('rf_loading')}</div></div>
    <div class="save-bar">
      <button class="save-btn" id="fastSaveBtn" onclick="saveFastAll()">${t('rf_save_all')}</button>
      <div class="save-msg" id="fastSaveMsg"></div>
    </div>
    ${(!isAdmin && ME && ME.agent_code) ? `
    <div class="cash-box">
      <h3>Submit Today's Marejesho (Cash Count)<span class="cash-status pending" id="cashStatusBadge">Pending</span></h3>
      <div class="desc">Fill in how many notes of each amount you collected today. This total goes straight into Combine for your agent code.</div>
      <table class="denomtbl">
        <tbody id="cashDenomBody"></tbody>
        <tr class="total-row"><th>TOTAL</th><td id="cashTotal">0</td></tr>
      </table>
      <button class="save-btn" style="margin-top:10px;" onclick="submitCashToCombine()">Submit to Combine</button>
      <div class="save-msg" id="cashMsg"></div>
    </div>` : ''}
  `;

  if(isAdmin){
    sb.from('mikopo_agents').select('*').order('code').then(({data})=>{
      AGENTS = data || [];
      document.getElementById('fastChips').innerHTML = ['ALL', ...AGENTS.map(a=>a.code)].map(code=>{
        const label = code==='ALL' ? 'All' : code;
        return `<div class="chip ${(!fastState.agentCode && code==='ALL') || fastState.agentCode===code ? 'active':''}" onclick="setFastAgent('${code==='ALL'?'':code}')">${label}</div>`;
      }).join('');
      loadFastRows();
    });
  } else {
    loadFastRows();
    if(ME && ME.agent_code) initCashBox();
  }
}

// ---- Agent cash-count submission -> feeds directly into Combine's Marejesho table ----
const CASH_DENOMS = [10000,5000,2000,1000,500,200,100,50];
function initCashBox(){
  document.getElementById('cashDenomBody').innerHTML = CASH_DENOMS.map(d => `
    <tr><th>${d.toLocaleString()}</th><td><input id="cd-${d}" type="number" min="0" value="0" oninput="if(+this.value<0)this.value=0; recalcCashTotal()"></td></tr>
  `).join('');
  loadCashSubmission();
}
function recalcCashTotal(){
  let t=0; CASH_DENOMS.forEach(d => t += (+document.getElementById(`cd-${d}`).value||0)*d);
  document.getElementById('cashTotal').textContent = t.toLocaleString();
}
async function loadCashSubmission(){
  const { data } = await sb.from('combine_agent_entries').select('*')
    .eq('work_date', fastState.date).eq('agent_code', ME.agent_code).eq('kind','marejesho').maybeSingle();
  CASH_DENOMS.forEach(d => { document.getElementById(`cd-${d}`).value = data ? (data[`d${d}`]||0) : 0; });
  const badge = document.getElementById('cashStatusBadge');
  const status = data ? data.status : 'pending';
  const labels = { pending:'Pending', confirmed:'Confirmed', incomplete:'Incomplete' };
  badge.textContent = labels[status] || 'Pending';
  badge.className = 'cash-status ' + status;
  recalcCashTotal();
  applyFastDayLock();
}
async function submitCashToCombine(){
  const msg = document.getElementById('cashMsg');
  if(isDateLocked(fastState.date)){ msg.textContent='Siku hii imefungwa. Admin Mkuu pekee anaweza kuhariri.'; msg.style.color='var(--red)'; return; }
  const payload = { work_date: fastState.date, agent_code: ME.agent_code, kind:'marejesho', status:'pending', updated_by: ME.id, updated_at: new Date().toISOString() };
  CASH_DENOMS.forEach(d => payload[`d${d}`] = +document.getElementById(`cd-${d}`).value||0);
  const { error } = await sb.from('combine_agent_entries').upsert([payload], { onConflict:'work_date,agent_code,kind' });
  if(error){ msg.textContent = error.message; msg.style.color = 'var(--red)'; return; }
  msg.textContent = 'Submitted to Combine.'; msg.style.color = 'var(--green)';
  loadCashSubmission();
}

function onFastDateChange(){
  fastState.date = document.getElementById('fastDate').value;
  loadFastRows();
  if(document.getElementById('cashDenomBody')) loadCashSubmission();
}
function setFastAgent(code){
  fastState.agentCode = code || null;
  document.querySelectorAll('#fastChips .chip').forEach(c=>c.classList.remove('active'));
  event.target.classList.add('active');
  loadFastRows();
}

// Picks the loan that still has a balance due (a client can have loan history, but only the active one shows here)
function pickActiveLoan(loans){
  return (loans||[]).slice()
    .sort((a,b)=> new Date(b.created_at)-new Date(a.created_at))
    .find(l=>{
      const paid = (l.mikopo_payments||[]).reduce((s,p)=>s+Number(p.kiasi),0);
      return Math.max(0, Number(l.jumla)-paid) > 0;
    }) || null;
}
function pickAllActiveLoans(loans){
  return (loans||[]).slice()
    .sort((a,b)=> new Date(a.created_at)-new Date(b.created_at))
    .filter(l=>{
      const paid = (l.mikopo_payments||[]).reduce((s,p)=>s+Number(p.kiasi),0);
      return Math.max(0, Number(l.jumla)-paid) > 0;
    });
}

async function loadFastRows(){
  const rowsEl = document.getElementById('fastRows');
  rowsEl.innerHTML = `<div class="state-msg">${t('rf_loading')}</div>`;
  document.getElementById('fastDateLabel').textContent = new Date(fastState.date+"T00:00:00").toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});

  try{
    let query = sb.from('mikopo_clients').select('*, mikopo_loans(*, mikopo_payments(*))');
    if(fastState.agentCode) query = query.eq('agent_code', fastState.agentCode);
    const { data: clients, error } = await query;
    if(error) throw error;

    const dateStr = fastState.date;
    FAST_ROWS = (clients||[])
      .flatMap(c=>{
        const activeLoans = pickAllActiveLoans(c.mikopo_loans);
        return activeLoans.map((loan, idx)=>{
          const paid = (loan.mikopo_payments||[]).reduce((s,p)=>s+Number(p.kiasi),0);
          const deniBaki = Math.max(0, Number(loan.jumla) - paid);
          const existing = (loan.mikopo_payments||[]).find(p=> p.tarehe && p.tarehe.slice(0,10) === dateStr);
          return {
            clientId: c.id, loanId: loan.id, jina: c.jina, nambaId: c.namba_ya_id || '—', agentCode: c.agent_code,
            loanTag: activeLoans.length > 1 ? ` (${t('rf_loan_no')} ${idx+1})` : '',
            deniBaki, paidTotal: paid, paymentId: existing?existing.id:null, amount: existing?Number(existing.kiasi):null
          };
        });
      })
      .filter(r=> r.deniBaki > 1 || r.amount)
      .sort((a,b)=> a.agentCode===b.agentCode ? a.jina.localeCompare(b.jina) : (a.agentCode||'').localeCompare(b.agentCode||''));

    renderFastRows();
  } catch(err){
    rowsEl.innerHTML = '<div class="state-msg">Failed to load: '+(err.message||err)+'</div>';
  }
}

function renderFastRows(){
  const rowsEl = document.getElementById('fastRows');
  if(FAST_ROWS.length===0){ rowsEl.innerHTML = `<div class="state-msg">${t('rf_no_balance')}</div>`; updateFastTotal(); return; }

  const showAgentCol = !fastState.agentCode;
  const dateColLabel = new Date(fastState.date+"T00:00:00").toLocaleDateString('en-GB',{day:'2-digit',month:'short'});

  // Assign a stable color band per agent code (cycles through 4 accent colors), matching
  // the look of the old spreadsheet ledger where each agent's rows had their own color block.
  const agentBandByCode = {};
  let bandIdx = 0;
  FAST_ROWS.forEach(r=>{
    if(!(r.agentCode in agentBandByCode)){ agentBandByCode[r.agentCode] = bandIdx % 4; bandIdx++; }
  });

  const headCols = [
    `<th>${t('rf_col_no')}</th>`,
    `<th>${t('rf_col_name')}</th>`,
    showAgentCol ? `<th>${t('rf_col_agent')}</th>` : '',
    `<th>${t('rf_col_id')}</th>`,
    `<th class="num">${t('rf_col_balance')}</th>`,
    `<th class="num">${t('rf_col_paid')}</th>`,
    `<th class="num">${t('rf_col_amount')} — ${dateColLabel}</th>`
  ].join('');

  const bodyRows = FAST_ROWS.map((r,i)=>{
    const band = `agent-band-${agentBandByCode[r.agentCode]}`;
    return `
    <tr class="${band}">
      <td>${i+1}</td>
      <td>${r.jina}${r.loanTag}</td>
      ${showAgentCol ? `<td class="agent-badge">${r.agentCode||'—'}</td>` : ''}
      <td>${r.nambaId}</td>
      <td class="num red">${tzs(r.deniBaki)}</td>
      <td class="num green">${tzs(r.paidTotal)}</td>
      <td class="num">
        <input class="r-input ${r.amount?'filled':''}" type="number" min="0" inputmode="numeric"
          id="famt-${i}" value="${r.amount ?? ''}" placeholder="0"
          oninput="if(+this.value<0)this.value=0; onFastAmountInput(${i})">
      </td>
    </tr>`;
  }).join('');

  rowsEl.innerHTML = `
    <div class="table-wrap">
      <table class="fast-table">
        <thead><tr>${headCols}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>`;
  updateFastTotal();
  attachAmountArrowNav();
  applyFastDayLock();
}

// ---- Automatic day lock: past dates become read-only for everyone except Admin ----
function isDateLocked(dateStr){
  const today = new Date().toISOString().slice(0,10);
  const isAdmin = ME && ME.role === 'admin';
  return dateStr < today && !isAdmin;
}
function applyFastDayLock(){
  const locked = isDateLocked(fastState.date);
  const banner = document.getElementById('fastLockBanner');
  if(banner) banner.style.display = locked ? 'block' : 'none';
  document.querySelectorAll('#fastRows input, .cash-box input, .cash-box button').forEach(el => { el.disabled = locked; });
  const saveBtn = document.getElementById('fastSaveBtn');
  if(saveBtn) saveBtn.disabled = locked;
}

// Excel-style Up/Down navigation between the repayment-amount cells
function attachAmountArrowNav(){
  const inputs = Array.from(document.querySelectorAll('.fast-table .r-input'));
  inputs.forEach((inp, idx) => {
    inp.addEventListener('keydown', e => {
      if(e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      const target = e.key === 'ArrowDown' ? inputs[idx+1] : inputs[idx-1];
      if(target){ target.focus(); target.select && target.select(); }
    });
  });
}

function onFastAmountInput(i){
  const val = document.getElementById('famt-'+i).value;
  FAST_ROWS[i].amount = val === '' ? null : Number(val);
  document.getElementById('famt-'+i).classList.toggle('filled', !!val);
  updateFastTotal();
}

function updateFastTotal(){
  const total = FAST_ROWS.reduce((s,r)=> s + (Number(r.amount)||0), 0);
  const count = FAST_ROWS.filter(r=> Number(r.amount) > 0).length;
  document.getElementById('fastTotal').textContent = tzs(total);
  document.getElementById('fastCountLabel').textContent = `${count} of ${FAST_ROWS.length} filled in`;
}

async function saveFastAll(){
  const btn = document.getElementById('fastSaveBtn');
  const msg = document.getElementById('fastSaveMsg');
  if(isDateLocked(fastState.date)){ msg.className='save-msg err'; msg.textContent='Siku hii imefungwa. Admin Mkuu pekee anaweza kuhariri.'; return; }
  const toSave = FAST_ROWS.filter(r=> Number(r.amount) > 0);
  if(toSave.length===0){ msg.className='save-msg err'; msg.textContent=t('rf_no_amount'); return; }

  btn.disabled = true;
  msg.className='save-msg'; msg.textContent = t('rf_saving');
  const dateISO = new Date(fastState.date+"T12:00:00").toISOString();
  let okCount = 0, errCount = 0;

  for(const r of toSave){
    try{
      if(r.paymentId){
        const { error } = await sb.from('mikopo_payments').update({ kiasi: r.amount }).eq('id', r.paymentId);
        if(error) throw error;
      } else {
        const { data, error } = await sb.from('mikopo_payments').insert({ client_id: r.clientId, loan_id: r.loanId, tarehe: dateISO, kiasi: r.amount }).select().single();
        if(error) throw error;
        r.paymentId = data.id;
      }
      okCount++;
    } catch(err){ errCount++; }
  }

  btn.disabled = false;
  msg.className = errCount ? 'save-msg err' : 'save-msg ok';
  msg.textContent = errCount
    ? `Saved ${okCount}, failed ${errCount}.`
    : `✓ Saved ${okCount} — Total ${tzs(toSave.reduce((s,r)=>s+Number(r.amount),0))}`;
}

// ================= FIND BY DATE =================
let FIND_LOADED = false;
let findState = { clientId: null, date: todayISO() };

function initFindPane(){
  FIND_LOADED = true;
  document.getElementById('findPane').innerHTML = `
    <input class="search" id="findSearch" placeholder="${t('rf_search_ph')}" oninput="onFindSearch()">
    <div id="findResults"></div>
    <div id="findDetail"></div>
  `;
}

let findDebounce;
function onFindSearch(){
  clearTimeout(findDebounce);
  findDebounce = setTimeout(async ()=>{
    const q = document.getElementById('findSearch').value.trim();
    const resultsEl = document.getElementById('findResults');
    document.getElementById('findDetail').innerHTML = '';
    if(q.length < 2){ resultsEl.innerHTML=''; return; }
    resultsEl.innerHTML = `<div class="state-msg">${t('rf_searching')}</div>`;
    let query = sb.from('mikopo_clients').select('id, jina, maarufu, agent_code, simu, namba_ya_id').ilike('jina', `%${q}%`).limit(15);
    const { data, error } = await query;
    if(error){ resultsEl.innerHTML = '<div class="state-msg">Error: '+error.message+'</div>'; return; }
    if(!data || data.length===0){ resultsEl.innerHTML = `<div class="state-msg">${t('rf_no_one')}</div>`; return; }
    resultsEl.innerHTML = data.map(c=>`
      <div class="r-card" style="cursor:pointer" onclick="selectFindClient('${c.id}','${c.jina.replace(/'/g,"\\'")}')">
        <div class="r-info"><div class="r-name">${c.jina}</div><div class="r-sub">ID: ${c.namba_ya_id||'—'} · ${c.maarufu||''} ${c.agent_code?'· '+c.agent_code:''}</div></div>
        <div class="chevron" style="color:var(--sub)">›</div>
      </div>`).join('');
  }, 300);
}

async function selectFindClient(clientId, jina){
  findState.clientId = clientId;
  document.getElementById('findResults').innerHTML = '';
  document.getElementById('findSearch').value = jina;
  await renderFindDetail();
}

async function renderFindDetail(){
  const el = document.getElementById('findDetail');
  el.innerHTML = `<div class="state-msg">${t('rf_loading')}</div>`;
  const { data: c, error } = await sb.from('mikopo_clients').select('*, mikopo_loans(*, mikopo_payments(*))').eq('id', findState.clientId).single();
  if(error){ el.innerHTML = '<div class="state-msg">Error: '+error.message+'</div>'; return; }

  const activeLoans = pickAllActiveLoans(c.mikopo_loans);
  if(activeLoans.length===0){
    el.innerHTML = `<div class="find-result"><div class="find-name">${c.jina}</div><div class="find-sub">${t('rf_no_active_loan')}</div></div>`;
    return;
  }
  if(!findState.loanId || !activeLoans.find(l=>l.id===findState.loanId)) findState.loanId = activeLoans[0].id;
  const activeLoan = activeLoans.find(l=>l.id===findState.loanId);
  const payment = (activeLoan.mikopo_payments||[]).find(p=> p.tarehe && p.tarehe.slice(0,10)===findState.date);
  const paid = (activeLoan.mikopo_payments||[]).reduce((s,p)=>s+Number(p.kiasi),0);
  const deniBaki = Math.max(0, Number(activeLoan.jumla)-paid);
  const loanPicker = activeLoans.length > 1 ? `
    <div class="chips" style="margin:10px 0 0;">
      ${activeLoans.map((l,idx)=>`<div class="chip ${l.id===findState.loanId?'active':''}" onclick="selectFindLoan('${l.id}')">${t('rf_loan_no')} ${idx+1} — ${tzs(Math.max(0,Number(l.jumla)-(l.mikopo_payments||[]).reduce((s,p)=>s+Number(p.kiasi),0)))}</div>`).join('')}
    </div>` : '';

  el.innerHTML = `
    <div class="find-result">
      <div class="find-name">${c.jina}</div>
      <div class="find-sub">ID: ${c.namba_ya_id||'—'} · ${c.simu||t('rf_no_phone')} · ${t('rf_balance_due')}: ${tzs(deniBaki)}</div>
      ${loanPicker}
      <div class="find-amount-row">
        <input type="date" class="date-input" id="findDateInput" value="${findState.date}" onchange="onFindDateChange()">
        <input class="r-input" style="width:130px" type="number" min="0" id="findAmount" placeholder="0" value="${payment?Number(payment.kiasi):''}" oninput="if(+this.value<0)this.value=0;">
      </div>
      <button class="save-btn" style="margin-top:12px" onclick="saveFindPayment('${payment?payment.id:''}', '${activeLoan.id}')">${t('rf_save')}</button>
      <div class="save-msg" id="findMsg"></div>
      <div id="calendarWrap" style="margin-top:18px"></div>
    </div>
  `;
  renderMiniCalendar(activeLoan);
}
function selectFindLoan(loanId){
  findState.loanId = loanId;
  renderFindDetail();
}

function onFindDateChange(){
  findState.date = document.getElementById('findDateInput').value;
  renderFindDetail();
}

async function saveFindPayment(existingId, loanId){
  const amount = Number(document.getElementById('findAmount').value || 0);
  const msg = document.getElementById('findMsg');
  if(amount <= 0){ msg.className='save-msg err'; msg.textContent=t('rf_enter_valid'); return; }
  try{
    const dateISO = new Date(findState.date+"T12:00:00").toISOString();
    if(existingId){
      const { error } = await sb.from('mikopo_payments').update({ kiasi: amount }).eq('id', existingId);
      if(error) throw error;
    } else {
      const { error } = await sb.from('mikopo_payments').insert({ client_id: findState.clientId, loan_id: loanId, tarehe: dateISO, kiasi: amount });
      if(error) throw error;
    }
    msg.className='save-msg ok'; msg.textContent=t('rf_saved');
    renderFindDetail();
  } catch(err){
    msg.className='save-msg err'; msg.textContent='Error: '+(err.message||err);
  }
}

// ---- Mini month calendar (marks days with a payment, scoped to the active loan) ----
let calMonth = new Date(); calMonth.setDate(1);
function renderMiniCalendar(loan){
  const wrap = document.getElementById('calendarWrap');
  const paymentsByDay = {};
  (loan.mikopo_payments||[]).forEach(p=>{ if(p.tarehe) paymentsByDay[p.tarehe.slice(0,10)] = Number(p.kiasi); });

  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthName = calMonth.toLocaleDateString('en-GB',{month:'long', year:'numeric'});

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const paid = paymentsByDay[iso];
    const selected = iso === findState.date;
    cells += `<div class="cal-day ${paid?'paid':''} ${selected?'selected':''}" onclick="jumpToDay('${iso}')" title="${paid?tzs(paid):''}">${d}</div>`;
  }

  wrap.innerHTML = `
    <div class="cal-head">
      <button class="cal-nav" onclick="changeCalMonth(-1)">‹</button>
      <div class="cal-title">${monthName}</div>
      <button class="cal-nav" onclick="changeCalMonth(1)">›</button>
    </div>
    <div class="cal-grid">
      ${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  `;
}
function changeCalMonth(delta){
  calMonth.setMonth(calMonth.getMonth()+delta);
  renderFindDetail();
}
function jumpToDay(iso){
  findState.date = iso;
  renderFindDetail();
}

// ================= AUTH =================
async function isCurrentUserAdmin(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user) return false;
  const { data: profile } = await sb.from('mikopo_profiles').select('*').eq('id', user.id).single();
  ME = profile;
  return !!(profile && profile.active);
}
async function checkAuth(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){
    if(await isCurrentUserAdmin()){ enterApp(); }
    else {
      await sb.auth.signOut();
      document.getElementById('authLoading').style.display='none';
      document.getElementById('loginBox').style.display='block';
      document.getElementById('appContent').style.display='none';
      document.getElementById('loginErr').textContent = 'This account is not active. Contact the admin.';
    }
  } else {
    document.getElementById('authLoading').style.display='none';
    document.getElementById('loginBox').style.display='block';
    document.getElementById('appContent').style.display='none';
  }
}
function enterApp(){
  document.getElementById('authGate').style.display='none';
  document.getElementById('appContent').style.display='block';
  initFastPane();
}
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent='';
  const {error} = await sb.auth.signInWithPassword({email,password:pass});
  if(error){ document.getElementById('loginErr').textContent = error.message; return; }
  if(await isCurrentUserAdmin()){ enterApp(); }
  else {
    await sb.auth.signOut();
    document.getElementById('loginErr').textContent = 'This account is not active. Contact the admin.';
  }
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }

function setLoginGreeting(){
  const h = new Date().getHours();
  const g = h < 12 ? 'Habari za Asubuhi' : h < 17 ? 'Habari za Mchana' : 'Habari za Jioni';
  const el = document.getElementById('loginGreeting');
  if(el) el.textContent = g;
}
function togglePwVisibility(){
  const input = document.getElementById('loginPass');
  const btn = document.getElementById('pwEyeBtn');
  if(!input) return;
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  if(btn) btn.style.opacity = showing ? '1' : '0.55';
}
setLoginGreeting();
applyTheme(localStorage.getItem('hekima_theme') || 'light');
applyLang(localStorage.getItem('hekima_lang') || 'en');
checkAuth();
