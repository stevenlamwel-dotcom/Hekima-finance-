<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hekima Mikopo</title>
<meta name="theme-color" content="#0F3D2E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#16211c;
    --paper:#f6f4ee;
    --green-900:#0f3d2e;
    --green-700:#1a5c44;
    --green-100:#e3ece6;
    --gold:#c99a3b;
    --gold-dim:#e7d2a0;
    --red:#a5432f;
    --line:#d8d3c4;
    --radius:14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{min-height:100vh;-webkit-tap-highlight-color:transparent;}
  h1,h2,h3{font-weight:700;letter-spacing:-0.01em;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---------- Login ---------- */
  #loginScreen{
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:32px 24px;background:
      radial-gradient(120% 90% at 15% -10%, #16543f 0%, var(--green-900) 55%, #0a2b20 100%);
    color:#fff;
  }
  .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;}
  .brand .mark{
    width:38px;height:38px;border-radius:9px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:var(--green-900);font-size:18px;flex:none;
  }
  .brand h1{font-size:22px;color:#fff;}
  .brand-sub{color:var(--gold-dim);font-size:13px;margin:0 0 40px 48px;}
  .login-card{
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);
    border-radius:var(--radius);padding:22px;backdrop-filter:blur(6px);
  }
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--gold-dim);margin-bottom:6px;letter-spacing:.02em;}
  .field input{
    width:100%;padding:13px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.08);color:#fff;font-size:16px;outline:none;
  }
  .field input:focus{border-color:var(--gold);}
  .field input::placeholder{color:rgba(255,255,255,0.4);}
  .btn-primary{
    width:100%;padding:14px;border-radius:10px;border:none;background:var(--gold);
    color:var(--green-900);font-weight:700;font-size:15px;margin-top:6px;
  }
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{opacity:.6;}
  #loginError{color:#ffb4a0;font-size:13px;margin-top:12px;min-height:16px;}

  /* ---------- App shell ---------- */
  #app{display:none;min-height:100vh;padding-bottom:40px;}
  header.topbar{
    position:sticky;top:0;z-index:10;background:var(--green-900);color:#fff;
    padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  }
  header.topbar .who{font-size:13px;}
  header.topbar .who b{display:block;font-size:15px;}
  header.topbar .role-pill{
    display:inline-block;margin-top:3px;font-size:10px;padding:2px 8px;border-radius:20px;
    background:var(--gold);color:var(--green-900);font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  }
  #logoutBtn{
    background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;
    padding:8px 12px;border-radius:8px;font-size:12px;
  }

  main{padding:18px;max-width:640px;margin:0 auto;}

  .stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
  .stats-row .stat{grid-column:span 1;}
  .stats-row .stat.wide{grid-column:1 / -1;}
  .stat{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
  }
  .stat .label{font-size:11px;color:#6b6a5f;text-transform:uppercase;letter-spacing:.04em;}
  .stat .value{font-size:20px;font-weight:800;margin-top:4px;color:var(--green-900);}
  .stat .value.gold{color:var(--gold);}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
  .section-title h2{font-size:15px;color:var(--green-900);text-transform:uppercase;letter-spacing:.03em;}
  .btn-add{
    background:var(--green-900);color:#fff;border:none;border-radius:9px;
    padding:9px 14px;font-size:13px;font-weight:600;
  }

  select#agentFilter{
    padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;
  }

  /* client card with repayment meter */
  .client-card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 16px;margin-bottom:12px;
  }
  .client-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .client-card .name{font-size:16px;font-weight:700;}
  .client-card .meta{font-size:12px;color:#6b6a5f;margin-top:2px;}
  .badge{
    font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    white-space:nowrap;
  }
  .badge.MPYA{background:#e6ecf5;color:#2a4f8f;}
  .badge.ENDELEA{background:var(--green-100);color:var(--green-700);}
  .badge.KAMILIKA{background:#eee7d6;color:var(--gold);}
  .badge.CHELEWA{background:#f4e1db;color:var(--red);}

  .meter-wrap{margin-top:12px;}
  .meter-track{
    height:8px;border-radius:20px;background:var(--green-100);overflow:hidden;position:relative;
  }
  .meter-fill{
    height:100%;border-radius:20px;background:linear-gradient(90deg, var(--green-700), var(--gold));
    transition:width .4s ease;
  }
  .meter-labels{display:flex;justify-content:space-between;font-size:11px;color:#6b6a5f;margin-top:5px;}
  .meter-labels b{color:var(--ink);}

  .card-actions{display:flex;gap:8px;margin-top:12px;}
  .card-actions button{
    flex:1;padding:9px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--line);
    background:#fff;color:var(--green-900);
  }
  .card-actions button.primary{background:var(--green-900);color:#fff;border-color:var(--green-900);}

  .empty-state{
    text-align:center;padding:32px 20px;color:#6b6a5f;font-size:13.5px;
    border:1.5px dashed var(--line);border-radius:var(--radius);
  }

  /* ---------- Modal / Sheet ---------- */
  .sheet-backdrop{
    display:none;position:fixed;inset:0;background:rgba(15,25,20,.5);z-index:50;
    align-items:flex-end;justify-content:center;
  }
  .sheet{
    background:var(--paper);width:100%;max-width:640px;border-radius:20px 20px 0 0;
    padding:20px 18px 26px;max-height:88vh;overflow-y:auto;
    animation:slideUp .22s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h3{font-size:17px;color:var(--green-900);margin-bottom:16px;}
  .sheet .field{margin-bottom:12px;}
  .sheet .field label{display:block;font-size:12px;color:#6b6a5f;margin-bottom:5px;}
  .sheet .field input, .sheet .field select{
    width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);font-size:15px;background:#fff;
  }
  .sheet .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .sheet-actions{display:flex;gap:10px;margin-top:16px;}
  .sheet-actions button{flex:1;padding:13px;border-radius:10px;font-weight:700;border:none;font-size:14.5px;}
  .sheet-actions .cancel{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .sheet-actions .save{background:var(--gold);color:var(--green-900);}
  .sheet-error{color:var(--red);font-size:13px;margin-top:8px;min-height:16px;}
  .close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:#6b6a5f;}

  .payment-item{
    display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;
  }
  .payment-item:last-child{border-bottom:none;}
  .payment-item .d{color:#6b6a5f;font-size:12px;}

  #toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--green-900);color:#fff;padding:12px 20px;border-radius:30px;
    font-size:13.5px;z-index:100;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="brand">
    <div class="mark">H</div>
    <h1>Hekima Mikopo</h1>
  </div>
  <p class="brand-sub">Mfumo wa usimamizi wa mikopo</p>
  <div class="login-card">
    <div class="field">
      <label>Barua pepe</label>
      <input type="email" id="loginEmail" placeholder="jina@mfano.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Nenosiri</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="loginBtn">Ingia</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="topbar">
    <div class="who">
      <b id="whoName">—</b>
      <span class="role-pill" id="whoRole">—</span>
    </div>
    <button id="logoutBtn">Toka</button>
  </header>

  <main>
    <div class="stats-row" id="statsRow"></div>

    <div id="agentFilterWrap" style="display:none;margin-bottom:6px;">
      <select id="agentFilter"></select>
    </div>

    <div class="section-title">
      <h2>Wateja</h2>
      <button class="btn-add" id="addClientBtn">+ Mteja mpya</button>
    </div>
    <div id="clientList"></div>

    <div id="adminAgentsSection" style="display:none;">
      <div class="section-title">
        <h2>Mawakala (Agents)</h2>
        <button class="btn-add" id="addAgentBtn">+ Wakala mpya</button>
      </div>
      <div id="agentList"></div>
    </div>
  </main>
</div>

<!-- Sheet: Add client -->
<div class="sheet-backdrop" id="clientSheetBackdrop">
  <div class="sheet">
    <button class="close-x" data-close="clientSheetBackdrop">✕</button>
    <h3>Ongeza Mteja Mpya</h3>
    <div class="field"><label>Jina kamili</label><input id="c_jina" placeholder="Jina la mteja"></div>
    <div class="field"><label>Jina maarufu (si lazima)</label><input id="c_maarufu"></div>
    <div class="two-col">
      <div class="field"><label>Simu</label><input id="c_simu" placeholder="07xx xxx xxx"></div>
      <div class="field"><label>Eneo</label><input id="c_eneo" placeholder="Mfano: Iringa"></div>
    </div>
    <div class="field" id="c_agentWrap" style="display:none;">
      <label>Wakala</label>
      <select id="c_agent"></select>
    </div>
    <div class="two-col">
      <div class="field"><label>Kiasi cha mkopo (TZS)</label><input id="c_mkopo" type="number" inputmode="decimal"></div>
      <div class="field"><label>Riba (%)</label><input id="c_riba" type="number" inputmode="decimal" value="0"></div>
    </div>
    <div class="field"><label>Lengo la kurejesha (TZS)</label><input id="c_rejesho" type="number" inputmode="decimal"></div>
    <div class="sheet-error" id="c_error"></div>
    <div class="sheet-actions">
      <button class="cancel" data-close="clientSheetBackdrop">Ghairi</button>
      <button class="save" id="c_save">Hifadhi</button>
    </div>
  </div>
</div>

<!-- Sheet: Client detail / payments -->
<div class="sheet-backdrop" id="detailSheetBackdrop">
  <div class="sheet">
    <button class="close-x" data-close="detailSheetBackdrop">✕</button>
    <h3 id="d_name">—</h3>
    <div class="stats-row" style="margin-bottom:16px;">
      <div class="stat"><div class="label">Mkopo</div><div class="value" id="d_mkopo">—</div></div>
      <div class="stat"><div class="label">Lengo la kurejesha</div><div class="value" id="d_lengo">—</div></div>
      <div class="stat wide"><div class="label">Deni linalobaki</div><div class="value gold" id="d_deni">—</div></div>
    </div>
    <div class="field two-col">
      <div>
        <label>Rekodi malipo mapya (TZS)</label>
        <input id="p_kiasi" type="number" inputmode="decimal" placeholder="0">
      </div>
      <div style="align-self:flex-end;">
        <button class="save" id="p_save" style="width:100%;padding:11px;border-radius:9px;border:none;background:var(--gold);color:var(--green-900);font-weight:700;">Rekodi</button>
      </div>
    </div>
    <div class="sheet-error" id="p_error"></div>
    <h3 style="margin-top:18px;font-size:14px;">Historia ya malipo</h3>
    <div id="paymentHistory" style="margin-top:8px;"></div>
  </div>
</div>

<!-- Sheet: Add agent -->
<div class="sheet-backdrop" id="agentSheetBackdrop">
  <div class="sheet">
    <button class="close-x" data-close="agentSheetBackdrop">✕</button>
    <h3>Ongeza Wakala Mpya</h3>
    <div class="field"><label>Msimbo (kifupi, mfano: JUM)</label><input id="a_code" style="text-transform:uppercase;"></div>
    <div class="field"><label>Jina kamili</label><input id="a_name"></div>
    <div class="sheet-error" id="a_error"></div>
    <div class="sheet-actions">
      <button class="cancel" data-close="agentSheetBackdrop">Ghairi</button>
      <button class="save" id="a_save">Hifadhi</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============ CONFIG ============ */
const SUPABASE_URL = "https://dftsvrxzyakhyadjwhnb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmdHN2cnh6eWFraHlhZGp3aG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNDczMzAsImV4cCI6MjEwMDYyMzMzMH0.k07kB77HAtIO-0JUca0b4drc9PyZObwIsZBXIYtfIL4";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============ STATE ============ */
let profile = null;      // current user's row in mikopo_profiles
let agents = [];         // all agents (admin) or just own (agent)
let clients = [];        // clients visible to this user (RLS-scoped)
let paymentsByClient = {}; // client_id -> [payments]
let activeClientId = null;
let agentFilterValue = "ALL";

/* ============ HELPERS ============ */
function fmtTZS(n){
  n = Number(n||0);
  return "TZS " + n.toLocaleString("en-US", {maximumFractionDigits:0});
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>{ t.style.display='none'; }, 2600);
}
function openSheet(id){ document.getElementById(id).style.display='flex'; }
function closeSheet(id){ document.getElementById(id).style.display='none'; }
document.querySelectorAll('[data-close]').forEach(btn=>{
  btn.addEventListener('click', ()=> closeSheet(btn.dataset.close));
});

function statusFor(client, paid){
  if (paid >= (client.rejesho_lengo||0) && client.rejesho_lengo > 0) return "KAMILIKA";
  if (client.mteja === "MPYA" && paid === 0) return "MPYA";
  const target = client.d_kamilisha ? new Date(client.d_kamilisha) : null;
  if (target && new Date() > target && paid < (client.rejesho_lengo||0)) return "CHELEWA";
  return "ENDELEA";
}
function statusLabel(s){
  return {MPYA:"Mpya", ENDELEA:"Inaendelea", KAMILIKA:"Imekamilika", CHELEWA:"Imechelewa"}[s] || s;
}

/* ============ AUTH ============ */
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = "";
  if(!email || !password){ errEl.textContent = "Jaza barua pepe na nenosiri."; return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = "Inaingia...";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = "Ingia";
  if(error){
    errEl.textContent = "Imeshindikana kuingia: barua pepe au nenosiri sio sahihi.";
    return;
  }
  await afterLogin();
}

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await sb.auth.signOut();
  location.reload();
});

async function afterLogin(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ return; }

  const { data: prof, error: profErr } = await sb.from('mikopo_profiles').select('*').eq('id', user.id).maybeSingle();
  if(profErr || !prof){
    document.getElementById('loginError').textContent = "Akaunti yako haijaongezwa kwenye mfumo bado. Wasiliana na admin.";
    await sb.auth.signOut();
    return;
  }
  profile = prof;

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('whoName').textContent = profile.full_name || profile.email || "Mtumiaji";
  document.getElementById('whoRole').textContent = profile.role === 'admin' ? 'Admin' : 'Wakala';

  if(profile.role === 'admin'){
    document.getElementById('adminAgentsSection').style.display = 'block';
    document.getElementById('agentFilterWrap').style.display = 'block';
    document.getElementById('c_agentWrap').style.display = 'block';
  }

  await loadAgents();
  await loadClientsAndPayments();
  render();
}

/* ============ DATA LOADING ============ */
async function loadAgents(){
  const { data, error } = await sb.from('mikopo_agents').select('*').order('name');
  agents = data || [];
  const filterSel = document.getElementById('agentFilter');
  filterSel.innerHTML = '<option value="ALL">Mawakala wote</option>' +
    agents.map(a=>`<option value="${a.code}">${a.name}</option>`).join('');
  filterSel.onchange = ()=>{ agentFilterValue = filterSel.value; renderClients(); };

  const cAgentSel = document.getElementById('c_agent');
  cAgentSel.innerHTML = agents.map(a=>`<option value="${a.code}">${a.name} (${a.code})</option>`).join('');
}

async function loadClientsAndPayments(){
  const { data: cData } = await sb.from('mikopo_clients').select('*').order('created_at', {ascending:false});
  clients = cData || [];

  const { data: pData } = await sb.from('mikopo_payments').select('*').order('tarehe', {ascending:false});
  paymentsByClient = {};
  (pData||[]).forEach(p=>{
    (paymentsByClient[p.client_id] ||= []).push(p);
  });
}

function paidFor(clientId){
  return (paymentsByClient[clientId]||[]).reduce((s,p)=> s + Number(p.kiasi||0), 0);
}

/* ============ RENDER ============ */
function render(){
  renderStats();
  renderClients();
  if(profile.role === 'admin') renderAgents();
}

function renderStats(){
  const visible = clients; // already RLS-scoped
  const totalLoaned = visible.reduce((s,c)=> s + Number(c.mkopo||0), 0);
  const totalPaid = visible.reduce((s,c)=> s + paidFor(c.id), 0);
  const outstanding = totalLoaned - totalPaid;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="label">Wateja</div><div class="value">${visible.length}</div></div>
    <div class="stat"><div class="label">Jumla mikopo</div><div class="value">${fmtTZS(totalLoaned)}</div></div>
    <div class="stat"><div class="label">Kimerejeshwa</div><div class="value">${fmtTZS(totalPaid)}</div></div>
    <div class="stat"><div class="label">Deni linalobaki</div><div class="value gold">${fmtTZS(outstanding)}</div></div>
  `;
}

function renderClients(){
  let list = clients;
  if(profile.role === 'admin' && agentFilterValue !== 'ALL'){
    list = list.filter(c=> c.agent_code === agentFilterValue);
  }
  const wrap = document.getElementById('clientList');
  if(list.length === 0){
    wrap.innerHTML = `<div class="empty-state">Hakuna wateja bado. Bonyeza "+ Mteja mpya" kuanza.</div>`;
    return;
  }
  wrap.innerHTML = list.map(c=>{
    const paid = paidFor(c.id);
    const target = Number(c.rejesho_lengo||0);
    const pct = target > 0 ? Math.min(100, Math.round((paid/target)*100)) : 0;
    const status = statusFor(c, paid);
    const agentName = (agents.find(a=>a.code===c.agent_code)||{}).name || c.agent_code || "";
    return `
    <div class="client-card">
      <div class="row1">
        <div>
          <div class="name">${escapeHtml(c.jina)}</div>
          <div class="meta">${c.simu ? c.simu+' · ' : ''}${c.eneo||''}${profile.role==='admin' ? ' · '+agentName : ''}</div>
        </div>
        <span class="badge ${status}">${statusLabel(status)}</span>
      </div>
      <div class="meter-wrap">
        <div class="meter-track"><div class="meter-fill" style="width:${pct}%"></div></div>
        <div class="meter-labels"><span><b>${fmtTZS(paid)}</b> / ${fmtTZS(target)}</span><span>${pct}%</span></div>
      </div>
      <div class="card-actions">
        <button class="primary" onclick="openClientDetail('${c.id}')">Ona / Rekodi malipo</button>
      </div>
    </div>`;
  }).join('');
}

function renderAgents(){
  const wrap = document.getElementById('agentList');
  if(agents.length===0){ wrap.innerHTML = `<div class="empty-state">Hakuna mawakala bado.</div>`; return; }
  wrap.innerHTML = agents.map(a=>{
    const count = clients.filter(c=>c.agent_code===a.code).length;
    return `<div class="client-card" style="padding:12px 16px;">
      <div class="row1"><div><div class="name" style="font-size:14.5px;">${escapeHtml(a.name)}</div>
      <div class="meta">Msimbo: ${a.code} · Wateja: ${count}</div></div></div>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============ ADD CLIENT ============ */
document.getElementById('addClientBtn').addEventListener('click', ()=>{
  document.getElementById('c_error').textContent = '';
  ['c_jina','c_maarufu','c_simu','c_eneo','c_mkopo','c_rejesho'].forEach(id=> document.getElementById(id).value='');
  document.getElementById('c_riba').value = '0';
  openSheet('clientSheetBackdrop');
});

document.getElementById('c_save').addEventListener('click', async ()=>{
  const errEl = document.getElementById('c_error');
  errEl.textContent = '';
  const jina = document.getElementById('c_jina').value.trim();
  const mkopo = parseFloat(document.getElementById('c_mkopo').value);
  const rejesho = parseFloat(document.getElementById('c_rejesho').value);
  const riba = parseFloat(document.getElementById('c_riba').value || '0');
  if(!jina || isNaN(mkopo) || isNaN(rejesho)){
    errEl.textContent = 'Jaza jina, kiasi cha mkopo, na lengo la kurejesha.';
    return;
  }
  const agent_code = profile.role === 'admin' ? document.getElementById('c_agent').value : profile.agent_code;
  if(!agent_code){
    errEl.textContent = 'Wakala hajapangwa kwa akaunti yako. Wasiliana na admin.';
    return;
  }
  const payload = {
    jina,
    maarufu: document.getElementById('c_maarufu').value.trim() || null,
    simu: document.getElementById('c_simu').value.trim() || null,
    eneo: document.getElementById('c_eneo').value.trim() || null,
    mkopo, riba, riba2:0,
    jumla: mkopo + (mkopo*riba/100),
    rejesho_lengo: rejesho,
    agent_code,
    mteja: 'MPYA'
  };
  const { error } = await sb.from('mikopo_clients').insert(payload);
  if(error){ errEl.textContent = 'Hitilafu: ' + error.message; return; }
  closeSheet('clientSheetBackdrop');
  showToast('Mteja ameongezwa.');
  await loadClientsAndPayments();
  render();
});

/* ============ CLIENT DETAIL / PAYMENTS ============ */
window.openClientDetail = async function(clientId){
  activeClientId = clientId;
  const c = clients.find(x=>x.id===clientId);
  if(!c) return;
  const paid = paidFor(clientId);
  document.getElementById('d_name').textContent = c.jina;
  document.getElementById('d_mkopo').textContent = fmtTZS(c.mkopo);
  document.getElementById('d_lengo').textContent = fmtTZS(c.rejesho_lengo);
  document.getElementById('d_deni').textContent = fmtTZS(Math.max(0, (c.rejesho_lengo||0) - paid));
  document.getElementById('p_kiasi').value = '';
  document.getElementById('p_error').textContent = '';
  renderPaymentHistory(clientId);
  openSheet('detailSheetBackdrop');
};

function renderPaymentHistory(clientId){
  const list = paymentsByClient[clientId] || [];
  const wrap = document.getElementById('paymentHistory');
  if(list.length===0){ wrap.innerHTML = '<div class="empty-state">Hakuna malipo bado.</div>'; return; }
  wrap.innerHTML = list.map(p=>`
    <div class="payment-item">
      <span>${fmtTZS(p.kiasi)}</span>
      <span class="d">${new Date(p.tarehe).toLocaleDateString('sw-TZ', {day:'2-digit',month:'short',year:'numeric'})}</span>
    </div>
  `).join('');
}

document.getElementById('p_save').addEventListener('click', async ()=>{
  const errEl = document.getElementById('p_error');
  errEl.textContent = '';
  const kiasi = parseFloat(document.getElementById('p_kiasi').value);
  if(!activeClientId || isNaN(kiasi) || kiasi<=0){
    errEl.textContent = 'Weka kiasi sahihi cha malipo.';
    return;
  }
  const { error } = await sb.from('mikopo_payments').insert({ client_id: activeClientId, kiasi });
  if(error){ errEl.textContent = 'Hitilafu: ' + error.message; return; }
  showToast('Malipo yamerekodiwa.');
  await loadClientsAndPayments();
  render();
  openClientDetail(activeClientId);
});

/* ============ ADD AGENT (admin) ============ */
document.getElementById('addAgentBtn').addEventListener('click', ()=>{
  document.getElementById('a_code').value = '';
  document.getElementById('a_name').value = '';
  document.getElementById('a_error').textContent = '';
  openSheet('agentSheetBackdrop');
});

document.getElementById('a_save').addEventListener('click', async ()=>{
  const errEl = document.getElementById('a_error');
  errEl.textContent = '';
  const code = document.getElementById('a_code').value.trim().toUpperCase();
  const name = document.getElementById('a_name').value.trim();
  if(!code || !name){ errEl.textContent = 'Jaza msimbo na jina.'; return; }
  const { error } = await sb.from('mikopo_agents').insert({ code, name });
  if(error){ errEl.textContent = 'Hitilafu: ' + error.message; return; }
  closeSheet('agentSheetBackdrop');
  showToast('Wakala ameongezwa.');
  await loadAgents();
  renderAgents();
});

/* ============ INIT ============ */
(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await afterLogin(); }
})();
</script>
